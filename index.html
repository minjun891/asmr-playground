  R: 100, cx: 0, cy: 0,
  off: [0, 0], offv: [0, 0],
  touches: new Map(),
  beads: [],
  color: SQUISH_COLORS[0],
  count: 0,
  time: 0,

  init(w, h) {
    this.R = Math.min(190, Math.min(w * 0.36, (h - 160) * 0.34));
    this.cx = w / 2; this.cy = h / 2 + 30;
    this.r = new Float32Array(this.N).fill(this.R);
    this.rest = new Float32Array(this.N).fill(this.R);
    this.bent = false;
    this.count = 0;
    this.v = new Float32Array(this.N);
    this.off = [0, 0]; this.offv = [0, 0];
    this.touches.clear();
    // 안에 들어 있는 바삭한 알갱이들 (극좌표로 저장해서 덩어리가 찌그러지면 함께 움직인다)
    this.beads = Array.from({ length: 150 }, () => ({
      rho: Math.sqrt(Math.random()) * 0.93, th: Math.random() * Math.PI * 2,
      s: 1.5 + Math.random() * 4.5, light: Math.random() < 0.6, a: 0.22 + Math.random() * 0.3,
    }));
    this.bgTex = this.buildBg(w, h);
    this.buildBeads();
    this.updateUI();
  },

  updateUI() { UI.setText(`${this.count}번 꾹`); },

  // 초기화: 기억된 모양을 지우면 스프링이 출렁이며 원래 동그란 모양으로 되돌린다
  reset() {
    this.rest.fill(this.R);
    this.count = 0;
    this.updateUI();
    Sound.squish(0.9, 0, true);
    Sound.crunch(0.6, 0);
    if (navigator.vibrate) navigator.vibrate(8);
  },

  // 각도 th 방향의 현재 반지름 (점 사이를 보간)
  radiusAt(th) {
    const N = this.N, f = ((th / (Math.PI * 2)) % 1 + 1) % 1 * N, i = Math.floor(f), t = f - i;
    return this.r[i % N] * (1 - t) + this.r[(i + 1) % N] * t;
  },

  onDown(x, y, speed, id) {
    const dx = x - (this.cx + this.off[0]), dy = y - (this.cy + this.off[1]);
    const d = Math.hypot(dx, dy), rr = this.radiusAt(Math.atan2(dy, dx) + Math.PI / 2);
    if (d > rr * 1.08) return; // 덩어리 바깥은 무시
    Sound.squish(0.8, this.pan(x), false);
    Sound.crunch(0.9, this.pan(x));
    if (navigator.vibrate) navigator.vibrate(5);
    this.count++; this.updateUI();
    this.touches.set(id, { x, y, press: 0, prev: 0, moved: 0, down: true, acc: 0 });
  },
  onMove(x, y, speed, id) {
    const t = this.touches.get(id);
    if (!t || !t.down) return;
    t.moved += Math.hypot(x - t.x, y - t.y);
    t.x = x; t.y = y;
  },
  onUp(id) {
    const t = this.touches.get(id);
    if (!t || !t.down) return;
    t.down = false;
    Sound.squish(0.6 * Math.max(0.4, t.press), this.pan(t.x), true); // 손을 떼면 폭신하게 되돌아오는 소리
    Sound.crunch(0.45, this.pan(t.x), 1.15);
  },
  pan(x) { return Math.max(-0.7, Math.min(0.7, (x / W) * 2 - 1)); },
  unmount() { this.touches.clear(); },

  update(dt) {
    dt = Math.min(dt, 0.033);
    this.time += dt;
    const N = this.N, R = this.R, ox = this.cx + this.off[0], oy = this.cy + this.off[1];
    const active = [...this.touches.values()];
    // 누르는 세기: 누르는 동안 빠르게 올라가고, 떼면 빠르게 내려간다
    for (const [id, t] of this.touches) {
      t.prev = t.press;
      t.press += ((t.down ? 1 : 0) - t.press) * Math.min(1, dt * (t.down ? 14 : 20));
      // 소리: 누르는 중 세기가 변하거나 문지를 때만 바삭한 알갱이가 터진다
      if (t.down) {
        const pressRate = Math.max(0, (t.press - t.prev) / dt), moveRate = (t.moved / dt) * t.press;
        const rate = Math.min(30, pressRate * 1.5 + moveRate / 60);
        t.acc += rate * dt; t.moved = 0;
        while (t.acc >= 1) {
          t.acc -= 1;
          Sound.crunch(Math.min(1, 0.4 + rate * 0.03) * (0.8 + Math.random() * 0.3), this.pan(t.x));
        }
      }
      if (!t.down && t.press < 0.02) this.touches.delete(id);
    }
    // 전체 찌그러짐: 손가락 쪽으로 납작하게 눌리고 옆으로 퍼진다. 가운데를 누를수록 크게 눌린다.
    let gs = 0, ax = 0, ay = -1;
    if (active.length) {
      const t = active[0], dx = t.x - ox, dy = t.y - oy, dist = Math.hypot(dx, dy);
      gs = t.press * (0.3 + 0.7 * Math.max(0, 1 - dist / R));
      if (dist > R * 0.25) { ax = dx / dist; ay = dy / dist; }   // 손가락이 있는 방향으로 눌린다 (가운데면 위에서 아래로)
    }
    const sA = 1 - 0.24 * gs, sP = 1 + 0.13 * gs;
    // 각 점의 목표 반지름: 손가락 근처는 안으로 눌리고, 나머지는 살짝 부풀어 부피를 지킨다
    const sigma = R * 0.55;
    for (let step = 0; step < 2; step++) {
      const h = dt / 2;
      for (let i = 0; i < N; i++) {
        const th = (i / N) * Math.PI * 2, ux = Math.sin(th), uy = -Math.cos(th);
        const bx = ox + R * ux, by = oy + R * uy;
        let dent = 0, bulge = 0;
        for (const t of active) {
          const d = Math.hypot(bx - t.x, by - t.y), w = Math.exp(-(d / sigma) * (d / sigma));
          dent += t.press * w * R * 0.5;
          bulge += t.press * (1 - w) * R * 0.045;
        }
        const cA = ux * ax + uy * ay, sq = 1 / Math.sqrt((cA / sA) * (cA / sA) + ((1 - cA * cA) / (sP * sP)));
        // eff: 지금 누르고 있어서 생기는 변화. 눌린 채 시간이 지나면 이 중 일부가 rest(기억된 모양)에 쌓여서
        // 손을 떼도 찌그러진 채로 남는다.
        const eff = R * (sq - 1) - dent + bulge;
        const target = Math.max(R * 0.35, this.rest[i] + eff + Math.sin(this.time * 1.6 + th * 3) * R * 0.004);
        this.rest[i] = Math.min(R * 1.4, Math.max(R * 0.42, this.rest[i] + eff * 1.4 * h));
        const l = this.r[(i + N - 1) % N], rt = this.r[(i + 1) % N];
        const a = 260 * (target - this.r[i]) - 14 * this.v[i] + 120 * (l + rt - 2 * this.r[i]);
        this.v[i] += a * h;
        this.r[i] += this.v[i] * h;
      }
      // 덩어리 전체가 손가락을 살짝 따라간다
      let tx = 0, ty = 0;
      if (active.length) {
        const t = active[0];
        tx = Math.max(-R * 0.18, Math.min(R * 0.18, (t.x - this.cx) * 0.14 * t.press));
        ty = Math.max(-R * 0.18, Math.min(R * 0.18, (t.y - this.cy) * 0.14 * t.press));
      }
      this.offv[0] += (170 * (tx - this.off[0]) - 12 * this.offv[0]) * h;
      this.offv[1] += (170 * (ty - this.off[1]) - 12 * this.offv[1]) * h;
      this.off[0] += this.offv[0] * h; this.off[1] += this.offv[1] * h;
    }
    // 기억된 모양의 뾰족한 부분을 조금씩 매끄럽게 (반죽이 눌린 것처럼)
    const kd = Math.min(1, dt * 6) * 0.25, tmp = new Float32Array(N);
    for (let i = 0; i < N; i++) tmp[i] = this.rest[i] + kd * ((this.rest[(i + N - 1) % N] + this.rest[(i + 1) % N]) / 2 - this.rest[i]);
    this.rest = tmp;
    // 많이 찌그러졌으면 초기화 버튼이 깜빡인다
    let dev = 0;
    for (let i = 0; i < N; i++) dev += Math.abs(this.rest[i] - R);
    const bent = dev / N / R > 0.12;
    if (bent !== this.bent) { this.bent = bent; UI.resetBtn.classList.toggle('pulse', bent); }
  },

  // ── 사실적인 젤리 렌더링 ──
  // 배경: 광택 있는 어두운 책상과 부드러운 조명
  buildBg(w, h) {
    const { cv, c } = mkTex(w, h);
    let g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#42345f'); g.addColorStop(1, '#1a142d');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    g = c.createRadialGradient(this.cx, this.cy - this.R * 0.3, 0, this.cx, this.cy - this.R * 0.3, Math.max(w, h) * 0.7);
    g.addColorStop(0, 'rgba(255,230,255,0.20)'); g.addColorStop(1, 'rgba(255,230,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    for (let i = 0; i < (w * h) / 80; i++) { c.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.05)'; c.fillRect(Math.random() * w, Math.random() * h, 1, 1); }
    g = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.8);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    return cv;
  },

  // 속에 든 알갱이 그림 두 종류: 하얗게 투명한 알갱이와 색이 짙은 알갱이 (구슬처럼 입체감이 있다)
  buildBeads() {
    const C = this.color, S = 32;
    const make = pale => {
      const { cv, c } = mkTex(S, S), m = S / 2;
      let g = c.createRadialGradient(m - 4, m - 5, 1, m, m, m);
      if (pale) { g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.45, 'rgba(255,255,255,0.5)'); g.addColorStop(1, 'rgba(255,255,255,0.12)'); }
      else { g.addColorStop(0, `rgba(${C.bead},0.75)`); g.addColorStop(0.6, `rgba(${C.bead},0.5)`); g.addColorStop(1, `rgba(${C.bead},0.2)`); }
      c.fillStyle = g; c.beginPath(); c.arc(m, m, m - 1, 0, Math.PI * 2); c.fill();
      g = c.createRadialGradient(m + 5, m + 6, 0, m + 5, m + 6, m * 0.9); // 아래쪽에 고이는 그림자
      g.addColorStop(0, `rgba(${C.bead},0.35)`); g.addColorStop(1, `rgba(${C.bead},0)`);
      c.fillStyle = g; c.beginPath(); c.arc(m, m, m - 1, 0, Math.PI * 2); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.9)'; c.beginPath(); c.ellipse(m - 5, m - 6, 3.2, 2, -0.6, 0, Math.PI * 2); c.fill(); // 하이라이트
      return cv;
    };
    this.beadTex = { pale: make(true), deep: make(false) };
  },

  setColor(c) { this.color = c; this.buildBeads(); },

  draw(ctx, w, h) {
    const N = this.N, R = this.R, ox = this.cx + this.off[0], oy = this.cy + this.off[1], C = this.color;
    ctx.drawImage(this.bgTex, 0, 0, w, h);

    // ── 바닥: 넓게 번지는 그림자, 젤리를 통과한 색 빛, 닿은 자리의 진한 그림자 ──
    const wd = (this.radiusAt(Math.PI / 2) + this.radiusAt(Math.PI * 1.5)) / 2, floorY = oy + this.radiusAt(Math.PI) * 0.97;
    const ell = (cxE, cyE, rx, ry, stops) => { // 타원형 방사 그라데이션
      ctx.save(); ctx.translate(cxE, cyE); ctx.scale(1, ry / rx);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
      for (const [o, col] of stops) g.addColorStop(o, col);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    };
    ell(ox + wd * 0.05, floorY + R * 0.05, wd * 1.25, R * 0.3, [[0, 'rgba(0,0,0,0.45)'], [0.6, 'rgba(0,0,0,0.18)'], [1, 'rgba(0,0,0,0)']]);
    ctx.globalCompositeOperation = 'lighter';
    ell(ox, floorY + R * 0.03, wd * 1.1, R * 0.28, [[0, hexA(C.base, 0.38)], [1, hexA(C.base, 0)]]);   // 젤리를 통과한 색 빛
    ctx.globalCompositeOperation = 'source-over';
    ell(ox, floorY, wd * 0.85, R * 0.09, [[0, 'rgba(0,0,0,0.6)'], [1, 'rgba(0,0,0,0)']]);               // 바닥에 닿은 자리

    // ── 윤곽 ──
    const pts = [];
    for (let i = 0; i < N; i++) { const th = (i / N) * Math.PI * 2; pts.push([ox + this.r[i] * Math.sin(th), oy - this.r[i] * Math.cos(th)]); }
    const path = () => {
      ctx.beginPath();
      const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], m0 = mid(pts[N - 1], pts[0]);
      ctx.moveTo(m0[0], m0[1]);
      for (let i = 0; i < N; i++) { const p = pts[i], m = mid(p, pts[(i + 1) % N]); ctx.quadraticCurveTo(p[0], p[1], m[0], m[1]); }
      ctx.closePath();
    };
    // ── 몸통 ──
    path();
    let g = ctx.createRadialGradient(ox - R * 0.3, oy - R * 0.4, R * 0.1, ox, oy, R * 1.25);
    g.addColorStop(0, C.light); g.addColorStop(0.45, C.base); g.addColorStop(1, C.dark);
    ctx.fillStyle = g; ctx.fill();
    ctx.save(); path(); ctx.clip();
    // 빛이 속에서 퍼지는 투명한 코어(서브서피스)와, 두꺼워서 어두운 아래쪽
    g = ctx.createRadialGradient(ox - R * 0.15, oy - R * 0.2, 0, ox - R * 0.15, oy - R * 0.2, R * 0.95);
    g.addColorStop(0, hexA(C.light, 0.6)); g.addColorStop(1, hexA(C.light, 0));
    ctx.fillStyle = g; ctx.fillRect(ox - R * 1.3, oy - R * 1.3, R * 2.6, R * 2.6);
    g = ctx.createRadialGradient(ox + R * 0.4, oy + R * 0.5, 0, ox + R * 0.4, oy + R * 0.5, R);
    g.addColorStop(0, hexA(C.dark, 0.4)); g.addColorStop(1, hexA(C.dark, 0));
    ctx.fillStyle = g; ctx.fillRect(ox - R * 1.3, oy - R * 1.3, R * 2.6, R * 2.6);
    // 속에 든 바삭한 알갱이들 (구슬처럼 입체적)
    for (const b of this.beads) {
      const rr = this.radiusAt(b.th) * b.rho, s = b.s * (R / 150) * 1.5;
      ctx.globalAlpha = Math.min(1, b.a * 2.2);
      ctx.drawImage(b.light ? this.beadTex.pale : this.beadTex.deep, ox + rr * Math.sin(b.th) - s, oy - rr * Math.cos(b.th) - s, s * 2, s * 2);
    }
    ctx.globalAlpha = 1;
    // 가장자리 안쪽으로 번지는 밝은 빛(프레넬)과 바닥에서 튕겨 올라온 빛
    path(); ctx.lineWidth = R * 0.16; ctx.strokeStyle = hexA(C.light, 0.3); ctx.stroke();
    g = ctx.createLinearGradient(0, oy + R * 0.2, 0, floorY); // 덩어리가 아래로 늘어나도 실제 바닥까지 이어지게
    g.addColorStop(0, hexA(C.light, 0)); g.addColorStop(1, hexA(C.light, 0.34));
    ctx.fillStyle = g; ctx.fillRect(ox - R * 2, oy + R * 0.2, R * 4, floorY - oy - R * 0.2 + R * 0.6);
    // 손가락이 누른 자리: 안쪽이 파여 어둡고, 빛을 받는 위쪽 가장자리는 밝고 아래쪽은 그늘진다
    for (const t of this.touches.values()) {
      const p = t.press; if (p < 0.02) continue;
      const rad = R * 0.5;
      const dg = ctx.createRadialGradient(t.x + rad * 0.08, t.y + rad * 0.1, 0, t.x, t.y, rad);
      dg.addColorStop(0, hexA(C.dark, 0.5 * p)); dg.addColorStop(0.7, hexA(C.dark, 0.16 * p)); dg.addColorStop(1, hexA(C.dark, 0));
      ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(t.x, t.y, rad, 0, Math.PI * 2); ctx.fill();
      ctx.lineCap = 'round'; ctx.lineWidth = Math.max(2, R * 0.03);
      ctx.strokeStyle = `rgba(255,255,255,${0.5 * p})`;
      ctx.beginPath(); ctx.arc(t.x - rad * 0.04, t.y - rad * 0.04, rad * 0.62, Math.PI * 0.75, Math.PI * 1.75); ctx.stroke();
      ctx.strokeStyle = hexA(C.dark, 0.4 * p);
      ctx.beginPath(); ctx.arc(t.x + rad * 0.04, t.y + rad * 0.04, rad * 0.62, -Math.PI * 0.25, Math.PI * 0.75); ctx.stroke();
    }
    ctx.restore();
    // 윤곽선: 바깥은 어둡게, 안쪽은 빛나게
    path(); ctx.lineWidth = 1.6; ctx.strokeStyle = hexA(C.dark, 0.55); ctx.stroke();
    // ── 반사광: 젤리의 굴곡을 따라 움직인다 ──
    const ang = (th, k = 1) => [ox + this.radiusAt(th) * k * Math.sin(th), oy - this.radiusAt(th) * k * Math.cos(th)];
    ctx.lineCap = 'round';
    ctx.save();
    ctx.shadowColor = 'rgba(255,255,255,0.8)'; ctx.shadowBlur = 5;
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = Math.max(2.5, R * 0.032);   // 빛이 오는 쪽 가장자리의 가느다란 반사
    ctx.beginPath();
    for (let a = -1.75; a <= -0.35; a += 0.07) { const [x, y] = ang(a, 0.93); if (a <= -1.75) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = Math.max(2, R * 0.022);      // 반대편 가장자리로 들어오는 되비침
    ctx.beginPath();
    for (let a = 1.9; a <= 2.7; a += 0.07) { const [x, y] = ang(a, 0.94); if (a <= 1.9) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.stroke();
    // 창문 모양의 큰 반사광
    const k = this.radiusAt(-Math.PI / 4) / R;
    ctx.save(); ctx.translate(ox - R * 0.4 * k, oy - R * 0.46 * k); ctx.rotate(-0.7);
    const hg = ctx.createLinearGradient(0, -R * 0.12, 0, R * 0.12);
    hg.addColorStop(0, 'rgba(255,255,255,0.85)'); hg.addColorStop(1, 'rgba(255,255,255,0.25)');
    ctx.fillStyle = hg; roundRect(ctx, -R * 0.24 * k, -R * 0.09 * k, R * 0.48 * k, R * 0.17 * k, R * 0.08 * k); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(ox - R * 0.16 * k, oy - R * 0.64 * k, R * 0.03, 0, Math.PI * 2); ctx.fill();
  },

  mount(sub) {
    SQUISH_COLORS.forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip' + (c === this.color ? ' on' : '');
      b.textContent = c.name;
      b.addEventListener('click', () => {
        this.setColor(c);
        sub.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
      });
      sub.append(b);
    });
  },
};

/* ───────────── UI ───────────── */
const UI = {
  countEl: document.getElementById('count'),
  resetBtn: document.getElementById('reset'),
  hintEl: document.getElementById('hint'),
  subEl: document.getElementById('sub'),
  setText(text) { this.countEl.textContent = text; },
  setCount(n, total) {
    this.countEl.textContent = `${n} / ${total}`;
    this.resetBtn.classList.toggle('pulse', total > 0 && n === total);
  },
  hideHint() { this.hintEl.classList.add('hide'); },
};

/* ───────────── 엔진 ───────────── */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, scene = BubbleWrap;
const SCENES = { bubble: BubbleWrap, keyboard: Keyboard, leaf: Leaves, squish: Squishy };

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scene.init(W, H);
}
window.addEventListener('resize', resize);
UI.resetBtn.addEventListener('click', () => (scene.reset ? scene.reset() : scene.init(W, H)));

// 포인터: 멀티터치 지원. 드래그 중 빠르게 움직여도 놓치지 않도록 이동 경로를 보간한다.
const pointers = new Map();
canvas.addEventListener('pointerdown', e => {
  Sound.unlock();
  UI.hideHint();
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, t: e.timeStamp });
  scene.onDown(e.clientX, e.clientY, 0, e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  const dist = Math.hypot(dx, dy);
  const speed = dist / Math.max(1, e.timeStamp - p.t) * 1000; // px/s
  const step = 8;
  const n = Math.max(1, Math.ceil(dist / step));
  for (let i = 1; i <= n; i++) scene.onMove(p.x + dx * i / n, p.y + dy * i / n, speed, e.pointerId);
  p.x = e.clientX; p.y = e.clientY; p.t = e.timeStamp;
});
const end = e => { pointers.delete(e.pointerId); scene.onUp(e.pointerId); };
canvas.addEventListener('pointerup', end);
canvas.addEventListener('pointercancel', end);

function setScene(next) {
  if (scene.unmount) scene.unmount();
  pointers.clear();
  scene = next;
  UI.subEl.textContent = '';
  if (scene.mount) scene.mount(UI.subEl);
  UI.resetBtn.style.visibility = scene.resetLabel ? 'visible' : 'hidden';
  UI.resetBtn.textContent = scene.resetLabel || '';
  UI.resetBtn.classList.remove('pulse');
  UI.hintEl.textContent = scene.hint;
  UI.hintEl.classList.remove('hide');
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', SCENES[b.dataset.scene] === scene));
  scene.init(W, H);
}
document.querySelectorAll('#tabs button').forEach(b => {
  b.addEventListener('click', () => setScene(SCENES[b.dataset.scene]));
});

// 처음 화면: 카드를 누르면 그 씬으로 들어간다 (이 클릭이 소리를 켜는 사용자 입력이 된다)
const homeEl = document.getElementById('home');
function isHome() { return !homeEl.classList.contains('hide'); }
function showHome() {
  if (scene.releaseAll) scene.releaseAll();
  pointers.clear();
  homeEl.classList.remove('hide');
}
document.querySelectorAll('.card').forEach(b => {
  b.addEventListener('click', () => {
    Sound.unlock();
    const next = SCENES[b.dataset.scene];
    if (next !== scene) setScene(next);
    homeEl.classList.add('hide');
  });
});
document.getElementById('homeBtn').addEventListener('click', showHome);

// 소리 끄기 버튼
const muteBtn = document.getElementById('mute');
function renderMute() {
  muteBtn.textContent = Sound.muted ? '🔇' : '🔊';
  muteBtn.title = Sound.muted ? '소리 켜기' : '소리 끄기';
  muteBtn.setAttribute('aria-label', muteBtn.title);
}
try { Sound.muted = localStorage.getItem('asmrMuted') === '1'; } catch (e) {}
muteBtn.addEventListener('click', () => { Sound.unlock(); Sound.setMuted(!Sound.muted); renderMute(); });
renderMute();

// 실제 키보드 (키보드 씬에서만 반응)
window.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || (e.target && e.target.tagName === 'INPUT') || !scene.onKeyDown || isHome()) return;
  Sound.unlock();
  if (scene.onKeyDown(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { if (scene.onKeyUp) scene.onKeyUp(e.code); });
window.addEventListener('blur', () => { if (scene.releaseAll) scene.releaseAll(); });

let last = performance.now();
let frameErrors = 0;
function frame(now) {
  requestAnimationFrame(frame); // 먼저 다음 프레임을 예약해서, 이번 프레임이 실패해도 멈추지 않게 한다
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (W < 1 || H < 1) return; // 창 크기가 0이면(백그라운드 탭 등) 그리지 않는다
  try {
    scene.update(dt);
    ctx.clearRect(0, 0, W, H);
    scene.draw(ctx, W, H);
  } catch (e) {
    if (frameErrors++ < 3) console.error('[그리기] 프레임 오류:', e);
  }
}

resize();
setScene(scene);
requestAnimationFrame(frame);
</script>
<script>
// 홈 화면에 추가했을 때 오프라인에서도 열리게 한다 (https 또는 localhost 에서만 동작)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
