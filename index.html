<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ASMR 놀이터</title>
<meta name="description" content="손끝으로 만지는 소리 — 뽁뽁이, 키보드, 낙엽, 말랑이">
<meta name="theme-color" content="#1d1730">
<meta property="og:title" content="ASMR 놀이터">
<meta property="og:description" content="손끝으로 만지는 소리 — 뽁뽁이, 키보드, 낙엽, 말랑이">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ASMR 놀이터">
<style>
  :root { --bg: #1d2333; --ui: #e8ecf7; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; user-select: none; -webkit-user-select: none; }
  .hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; color: var(--ui); pointer-events: none; }
  .hud .count { font-size: 15px; opacity: .8; font-variant-numeric: tabular-nums; }
  .hud button { pointer-events: auto; border: 0; border-radius: 999px; padding: 9px 16px; font: inherit; font-size: 14px; color: var(--ui); background: rgba(255,255,255,.12); cursor: pointer; }
  .hud button:active { background: rgba(255,255,255,.25); }
  .hud button.pulse { animation: pulse 1s ease-in-out infinite; background: rgba(255,255,255,.28); }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hud .tabs { pointer-events: auto; display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.08); }
  .hud .tabs button { padding: 7px 14px; background: transparent; opacity: .6; }
  .hud .tabs button.on { background: rgba(255,255,255,.2); opacity: 1; }
  .sub { position: fixed; top: 62px; left: 0; right: 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 0 12px; pointer-events: none; }
  .chip { pointer-events: auto; border: 0; border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; color: var(--ui); background: rgba(255,255,255,.1); cursor: pointer; }
  .chip.on { background: rgba(255,255,255,.28); }
  .hud .count, .hud button { white-space: nowrap; }
  @media (max-width: 480px) {
    .hud { padding: 10px 10px; gap: 6px; }
    .hud .count { font-size: 13px; }
    .hud button { padding: 7px 11px; font-size: 13px; }
    .hud .tabs button { padding: 6px 10px; }
  }
  .hint { position: fixed; bottom: 22px; left: 64px; right: 64px; text-align: center; color: var(--ui); opacity: .5; font-size: 14px; pointer-events: none; transition: opacity .6s; }
  .hint.hide { opacity: 0; }

  /* 처음 화면 */
  .home { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 30px; padding: 24px 16px 80px; overflow: hidden; color: var(--ui); text-align: center;
    background: radial-gradient(ellipse at 50% 30%, #2f2a52 0%, #1d1a33 55%, #14122380 100%), #14122b;
    transition: opacity .4s, visibility .4s; }
  .home.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .home .glow { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .35; animation: drift 14s ease-in-out infinite alternate; pointer-events: none; }
  .home .g1 { width: 300px; height: 300px; background: #ff8fb8; top: -60px; left: -80px; }
  .home .g2 { width: 340px; height: 340px; background: #6fb0ff; bottom: -100px; right: -90px; animation-delay: -5s; }
  .home .g3 { width: 240px; height: 240px; background: #ffd96a; top: 45%; left: 55%; opacity: .2; animation-delay: -9s; }
  @keyframes drift { to { transform: translate(40px, -30px) scale(1.15); } }
  .home .hero, .home .cards { position: relative; }
  .home h1 { margin: 0 0 8px; font-size: clamp(32px, 9vw, 48px); letter-spacing: -.02em; }
  .home .hero p { margin: 0; font-size: 14px; opacity: .7; }
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: min(440px, 100%); }
  .card { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; border-radius: 22px; padding: 22px 10px 18px;
    color: #fff; font: inherit; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .15s; }
  .card:hover { transform: translateY(-2px); }
  .card:active { transform: scale(.96); }
  .card .ico { font-size: 44px; line-height: 1.1; }
  .card b { font-size: 17px; }
  .card small { font-size: 12.5px; opacity: .85; }
  .card[data-scene=bubble]   { background: linear-gradient(145deg, #4a78c9, #6fb0ff); }
  .card[data-scene=keyboard] { background: linear-gradient(145deg, #6b5bd6, #a08bff); }
  .card[data-scene=leaf]     { background: linear-gradient(145deg, #c8651e, #e2a93b); }
  .card[data-scene=squish]   { background: linear-gradient(145deg, #e0508f, #ff9ec4); }

  /* 왼쪽 아래 처음 화면 버튼, 오른쪽 아래 소리 끄기 버튼 */
  .fab { position: fixed; bottom: 14px; z-index: 30; width: 44px; height: 44px; border: 0; border-radius: 50%; font-size: 20px; line-height: 1;
    color: var(--ui); background: rgba(255,255,255,.14); backdrop-filter: blur(6px); cursor: pointer; }
  .fab:active { background: rgba(255,255,255,.3); }
  #homeBtn { left: 14px; }
  #mute { right: 14px; }
  .home:not(.hide) ~ #homeBtn { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <span class="count" id="count"></span>
  <div class="tabs" id="tabs">
    <button data-scene="bubble">뽁뽁이</button>
    <button data-scene="keyboard">키보드</button>
    <button data-scene="leaf">낙엽</button>
    <button data-scene="squish">말랑이</button>
  </div>
  <button id="reset">새 뽁뽁이</button>
</div>
<div class="sub" id="sub"></div>
<div class="hint" id="hint">터치하거나 드래그해서 터뜨려 보세요</div>

<div class="home" id="home">
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
  <div class="hero">
    <h1>ASMR 놀이터</h1>
    <p>손끝으로 만지는 소리 · 이어폰을 끼면 더 좋아요 🎧</p>
  </div>
  <div class="cards">
    <button class="card" data-scene="bubble"><span class="ico">🫧</span><b>뽁뽁이</b><small>톡톡 터뜨리기</small></button>
    <button class="card" data-scene="keyboard"><span class="ico">⌨️</span><b>키보드</b><small>타건음 즐기기</small></button>
    <button class="card" data-scene="leaf"><span class="ico">🍂</span><b>낙엽</b><small>바스락 부수기</small></button>
    <button class="card" data-scene="squish"><span class="ico">🩷</span><b>말랑이</b><small>꾹꾹 주무르기</small></button>
  </div>
</div>
<button class="fab" id="homeBtn" aria-label="처음 화면" title="처음 화면">🏠</button>
<button class="fab" id="mute" aria-label="소리 끄기" title="소리 끄기">🔊</button>

<script src="keysamples.js"></script>
<script src="leafsample.js"></script>
<script>
'use strict';

/* ───────────── 키보드 스위치별 소리 설정 ───────────── */
const KEY_SWITCHES = {
  // 참고 음원(4:00~4:30)에서 잘라낸 실제 타건음. keysamples.js 의 KEY_SAMPLES 를 무작위로 재생한다.
  real:  { name: '실제 타건음', sample: true },
  // click: 딸깍(상단 클릭) 세기, gap: 클릭에서 바닥 치는 소리까지의 간격(초)
  brown: { name: '갈축',     click: 0.45, clickF: 3200, gap: 0.008, thock: 0.75, thockF: 195, knock: 0.6,  knockF: 850,  up: 0.35 },
  // 청축: "찰칵찰칵" — 누를 때 "찰"(쓸리는 스침) + "칵"(딱 걸리는 소리), 뗄 때 작은 "찰칵" 한 번 더. 저음 몸통은 거의 없이 맑고 청량하게.
  blue:  { name: '청축',     snappy: true, gain: 1.4, click: 0.9, clickF: 5000, gap: 0.014, thock: 0.45, thockF: 230, knock: 0.5, knockF: 1100, up: 0.5, click2: true },
};

/* ───────────── 오디오 (합성음) ───────────── */
const Sound = {
  ctx: null,
  master: null,
  dry: null,
  wet: null,
  noise: null,
  voices: [],
  MAX_VOICES: 24,
  muted: false,      // 소리 끄기 (브라우저에 저장된다)
  crunchBank: null,  // 합성한 짧은 "바삭" 알갱이 소리 여러 개
  leafSample: null,  // 디코딩된 실제 낙엽 소리 (약 3.9초)
  samples: [],       // 디코딩된 실제 타건음 버퍼
  lastSample: -1,
  // ?tune 패널에서 조절하는 값. 마음에 드는 값을 여기 기본값으로 옮기면 된다.
  params: { pitch: 1.54, bright: 1.46, body: 0.27, tail: 0.57, reverb: 0.1 },

  // 브라우저 정책상 첫 사용자 입력에서 만들고 resume 해야 한다
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      const c = this.ctx = new AC({ latencyHint: 'interactive' });
      this.master = c.createGain();
      this.master.gain.value = this.muted ? 0 : 0.9;
      const comp = c.createDynamicsCompressor(); // 연타 시 클리핑 방지
      this.master.connect(comp).connect(c.destination);

      this.dry = c.createGain();
      this.dry.connect(this.master);

      // 아주 얕은 방 울림: 지수로 감쇠하는 노이즈 임펄스
      const conv = c.createConvolver();
      const ilen = Math.floor(c.sampleRate * 0.25);
      const imp = c.createBuffer(2, ilen, c.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = imp.getChannelData(ch);
        for (let i = 0; i < ilen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / ilen, 3);
      }
      conv.buffer = imp;
      this.wet = c.createGain();
      this.wet.gain.value = this.params.reverb;
      conv.connect(this.wet).connect(this.master);
      this.convIn = conv;

      const len = Math.floor(c.sampleRate * 0.3);
      this.noise = c.createBuffer(1, len, c.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      // 하나가 실패해도 나머지와 resume() 은 계속 진행되도록 각각 감싼다
      for (const init of [() => this._loadSamples(), () => this._loadLeaf(), () => this._makeCrunchBank()]) {
        try { init(); } catch (e) { console.error('[소리] 초기화 실패:', e); }
      }
    }
    if (this.ctx.state !== 'running') this.ctx.resume();
  },

  // base64 WAV → AudioBuffer (file:// 로 열어도 되도록 fetch 없이 직접 디코딩)
  _loadSamples() {
    if (typeof KEY_SAMPLES === 'undefined') return;
    for (const url of KEY_SAMPLES) {
      const bin = atob(url.slice(url.indexOf(',') + 1));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      this.ctx.decodeAudioData(bytes.buffer).then(b => this.samples.push(b), () => {});
    }
  },

  // 실제 타건음 재생: 녹음에 이미 뗄 때 소리가 섞여 있어서 누를 때만 소리를 낸다.
  _sample(size, down, vol, pan) {
    if (!down || !this.samples.length) return;
    let i;
    do { i = Math.floor(Math.random() * this.samples.length); }
    while (this.samples.length > 1 && i === this.lastSample);   // 같은 소리 연속 재생 방지
    this.lastSample = i;
    const buf = this.samples[i];
    const rate = (0.97 + Math.random() * 0.06) * Math.pow(size, -0.08); // 큰 키일수록 살짝 낮게
    const { out, pn } = this._voice(vol * 0.7 * (0.85 + Math.random() * 0.3), pan);
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = rate;
    src.connect(out);
    src.start();
    this._release(out, pn, buf.duration / rate + 0.2);
  },

  _loadLeaf() {
    if (typeof LEAF_SAMPLE === 'undefined') {
      console.error('[소리] leafsample.js 를 불러오지 못했어요. index.html 과 같은 폴더에 있는지 확인하세요. (임시로 합성음을 대신 사용합니다)');
      return;
    }
    const bin = atob(LEAF_SAMPLE.slice(LEAF_SAMPLE.indexOf(',') + 1));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    this.ctx.decodeAudioData(bytes.buffer).then(b => { this.leafSample = b; this._rankLeafOnsets(b); }, e => console.error('[소리] 낙엽 소리 디코딩 실패:', e));
  },

  // 각 시작 지점에서 "처음 25ms의 세기 ÷ 그 뒤 175ms의 세기"를 재서, 톡 하고 또렷하게 시작하는 지점을 골라 둔다.
  // 부스러기나 "콰"처럼 짧은 소리에 뭉개지는 지점을 쓰면 "쉬이익" 하는 바람 소리처럼 들린다.
  _rankLeafOnsets(b) {
    const d = b.getChannelData(0), sr = b.sampleRate, a = Math.floor(0.025 * sr), L = Math.floor(0.2 * sr);
    const scored = LEAF_ONSETS.map(([t], i) => {
      const i0 = Math.floor(Math.max(0, t) * sr); let e1 = 0, e2 = 0;
      for (let k = 1; k < L && i0 + k < d.length; k++) { const v = d[i0 + k] - d[i0 + k - 1]; if (k < a) e1 += v * v; else e2 += v * v; } // 차분: 고음(바삭한 대역) 위주
      return [i, (e1 / a) / (e2 / (L - a) + 1e-12)];
    }).sort((x, y) => y[1] - x[1]);
    this.leafPunchy = scored.slice(0, Math.max(6, Math.round(scored.length * 0.4))).map(x => x[0]);
  },

  // 살짝 찌그러뜨리는 곡선: 작은 소리는 키우고 큰 소리는 눌러서 빽빽한 질감을 만든다. k 가 클수록 더 세게 찌그러진다.
  _satCurve(k = 2.5) {
    this._sats = this._sats || {};
    if (!this._sats[k]) {
      const n = 1024, c = new Float32Array(n);
      for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1; c[i] = Math.tanh(k * x) / Math.tanh(k); }
      this._sats[k] = c;
    }
    return this._sats[k];
  },

  // 낙엽 부서지는 소리 "콰사삭": 전부 실제 낙엽 녹음으로 만든다.
  //  1) 콰   : 같은 녹음을 낮게(느리게) 재생한 아주 짧은 층. 묵직한 눌림을 진짜 소재로 낸다.
  //  2) 사삭 : 녹음 두 겹을 조금 어긋나게 겹친 길고 촘촘한 바스락거림.
  // 합성한 사인파 "붕"이나 낮춰 튼 합성 바삭 소리는 넣지 않는다. 진짜 소리와 섞이면 전자음처럼 들렸다.
  // level: 0 낙엽 · 1 조각 · 2 부스러기
  leaf(level, vol = 1, pan = 0) {
    const c = this.ctx;
    if (!c) return;
    const buf = this.leafSample, lv = Math.min(2, level);
    if (!buf) { // 파일을 못 불러왔거나 아직 준비 중이면 합성 바삭 소리로 대신한다
      this.crunch(vol * [1, 0.85, 0.7][lv], pan, [0.75, 1.0, 1.25][lv]);
      return;
    }
    const t = c.currentTime;
    const { out, pn } = this._voice(vol * [0.8, 0.85, 0.5][lv], pan);
    const sat = c.createWaveShaper();   // 약하게만 눌러서 빽빽하게 (세게 누르면 시작 순간에 찌그러져 거칠어진다)
    sat.curve = this._satCurve(1.6); sat.oversample = '2x';
    sat.connect(out);
    let longest = 0;
    // 녹음에서 무작위 지점을 잘라 재생. hpF 아래는 걷어 낸다:
    // 녹음에 섞인 175~280Hz 웅웅거림이 잦아들 때 "후웅" 하고 남거나 두 겹이 겹치면 울렁거렸다.
    const punchy = this.leafPunchy && this.leafPunchy.length;
    const layer = (delay, D, rate, mul, pw, hpF = 850, sharp = false) => {
      const pool = sharp && punchy ? this.leafPunchy : null;   // sharp: 또렷하게 시작하는 지점만 사용
      const on = pool ? LEAF_ONSETS[pool[Math.floor(Math.random() * pool.length)]][0] : LEAF_ONSETS[Math.floor(Math.random() * LEAF_ONSETS.length)][0];
      const start = Math.max(0, Math.min(on, buf.duration - D - 0.02)), dur = D / rate;
      const N = 96, curve = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        const x = i / (N - 1), a = Math.min(1, (x * dur) / 0.004);
        curve[i] = mul * a * a * (3 - 2 * a) * Math.pow(1 - x, pw);
      }
      const env = c.createGain(), src = c.createBufferSource();
      env.gain.setValueCurveAtTime(curve, t + delay, dur);
      src.buffer = buf; src.playbackRate.value = rate;
      const hp1 = c.createBiquadFilter(), hp2 = c.createBiquadFilter();
      hp1.type = hp2.type = 'highpass'; hp1.frequency.value = hp2.frequency.value = hpF; hp1.Q.value = hp2.Q.value = 0.707;
      src.connect(hp1).connect(hp2).connect(env).connect(sat);
      src.start(t + delay, start, D);
      longest = Math.max(longest, delay + dur);
    };
    const r = Math.random;
    // 층마다 합이 1을 넘지 않게 세기를 잡아서, 시작 순간에 소리가 뭉개지지 않게 한다
    if (lv === 0) {
      layer(0, 0.09, 0.78 + r() * 0.1, 0.55, 2.2, 500, true);   // 콰: 낮게 튼 짧은 층 (묵직한 눌림)
      layer(0, 0.6, 0.88 + r() * 0.1, 0.7, 1.1);                  // 사삭
      layer(0.03, 0.42, 1.05 + r() * 0.12, 0.45, 1.4);            // 어긋나게 겹쳐 촘촘하게
    } else if (lv === 1) {
      layer(0, 0.07, 0.9 + r() * 0.1, 0.4, 2.2, 500, true);
      layer(0, 0.2, 0.95 + r() * 0.1, 0.8, 1.9);                  // 조각은 0.34초에서 0.2초로 짧게
    } else {
      layer(0, 0.075, 0.98 + r() * 0.14, 1.0, 2.6, 850, true);    // 부스러기: "톡" 하고 끝나게 아주 짧게 (0.2초에서 0.075초로)
    }
    this._release(out, pn, longest + 0.3);
  },

  // 크런치 말랑이의 "바삭": 저음 몸통이 살아 있는 짧은 알갱이 소리 20가지.
  // (낙엽 소리보다 낮고 둔탁하다)
  _makeCrunchBank() {
    const c = this.ctx, sr = c.sampleRate;
    this.crunchBank = Array.from({ length: 20 }, () => {
      const dur = 0.07 + Math.random() * 0.05, n = Math.floor(sr * dur);
      const buf = c.createBuffer(1, n, sr), d = buf.getChannelData(0);
      const grains = 5 + Math.floor(Math.random() * 6);
      for (let g = 0; g < grains; g++) {
        const t0 = Math.floor(Math.pow(Math.random(), 1.4) * n * 0.6);
        const len = Math.floor(sr * (0.0008 + Math.random() * 0.003));
        const amp = (0.3 + Math.random() * 0.7) * Math.exp(-(t0 / n) * 1.8);
        const f = 900 + Math.random() * 3300, r = 0.9 + Math.random() * 0.05;
        const c1 = 2 * r * Math.cos(2 * Math.PI * f / sr), c2 = r * r;
        let y1 = 0, y2 = 0;
        for (let i = 0; i < len * 3 && t0 + i < n; i++) {
          const x = i < len ? (Math.random() * 2 - 1) * (1 - i / len) : 0;
          const y = x + c1 * y1 - c2 * y2;
          y2 = y1; y1 = y;
          d[t0 + i] += amp * y * (1 - r) * 4;
        }
      }
      let lp = 0; // 저음 몸통
      for (let i = 0; i < n; i++) {
        lp += ((Math.random() * 2 - 1) - lp) * 0.1;
        d[i] += 0.5 * lp * (1 - Math.exp(-i / (sr * 0.002))) * Math.exp(-i / (n * 0.4));
      }
      let pk = 0;
      for (let i = 0; i < n; i++) pk = Math.max(pk, Math.abs(d[i]));
      const fade = Math.floor(sr * 0.008);
      for (let i = 0; i < n; i++) d[i] = (d[i] / (pk || 1)) * 0.9 * (i > n - fade ? (n - i) / fade : 1);
      return buf;
    });
  },

  crunch(vol = 1, pan = 0, rate = 1) {
    if (!this.ctx || !this.crunchBank) return;
    const buf = this.crunchBank[Math.floor(Math.random() * this.crunchBank.length)];
    const r = rate * (0.85 + Math.random() * 0.3);
    const { out, pn } = this._voice(vol * 0.7, pan);
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.playbackRate.value = r;
    src.connect(out); src.start();
    this._release(out, pn, buf.duration / r + 0.1);
  },

  // 말랑이가 눌릴 때(up=false)와 되돌아올 때(up=true)의 낮고 말랑한 "찌걱" 소리
  squish(vol = 1, pan = 0, up = false) {
    const c = this.ctx;
    if (!c || !this.noise) return;
    const t = c.currentTime, f0 = up ? 260 : 520, f1 = up ? 620 : 240;
    const { out, pn } = this._voice(vol * 0.6, pan);
    const n = this._noise(t, 0.22, 'bandpass', f0, 2.2);
    n.f.frequency.setValueAtTime(f0, t);
    n.f.frequency.exponentialRampToValueAtTime(f1, t + 0.12);
    n.g.gain.setValueAtTime(0.0001, t);
    n.g.gain.exponentialRampToValueAtTime(0.7, t + 0.012);
    n.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    n.g.connect(out);
    this._release(out, pn, 0.45);
  },

  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem('asmrMuted', m ? '1' : '0'); } catch (e) {}
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.02); // 뚝 끊기지 않게
  },

  setReverb(v) {
    this.params.reverb = v;
    if (this.wet) this.wet.gain.value = v;
  },

  _noise(t, dur, type, freq, q) {
    const c = this.ctx;
    const src = c.createBufferSource();
    src.buffer = this.noise;
    const f = c.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    if (q) f.Q.value = q;
    const g = c.createGain();
    src.connect(f).connect(g);
    src.start(t, Math.random() * 0.1); // 매번 다른 노이즈 구간
    src.stop(t + dur);
    return { f, g };
  },

  // vol: 0~1, pitch: 1 = 기본, pan: -1~1, delay: 초
  pop(vol = 1, pitch = 1, pan = 0, delay = 0) {
    const c = this.ctx;
    if (!c) return;
    const P = this.params;
    const t = c.currentTime + delay;
    const p = pitch * P.pitch;
    const { out, pn } = this._voice(vol * 0.6, pan);

    // 1) 트랜지언트: 막이 찢어지는 아주 짧은 클릭
    const click = this._noise(t, 0.05, 'highpass', 3500 * P.bright);
    click.g.gain.setValueAtTime(0.0001, t);
    click.g.gain.exponentialRampToValueAtTime(0.7, t + 0.0005);
    click.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.012 + Math.random() * 0.006);
    click.g.connect(out);

    // 2) 공명: 속이 빈 "뽁" 질감 (Q 높은 밴드패스)
    const f1 = (900 + Math.random() * 600) * p * P.bright;
    const res = this._noise(t, 0.12, 'bandpass', f1, 6);
    res.f.frequency.setValueAtTime(f1, t);
    res.f.frequency.exponentialRampToValueAtTime(f1 * 0.7, t + 0.04);
    res.g.gain.setValueAtTime(0.0001, t);
    res.g.gain.exponentialRampToValueAtTime(0.8, t + 0.001);
    res.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    res.g.connect(out);

    // 3) 몸통: 살짝 디튠된 두 파형이 빠르게 내려가는 "폭"
    const f0 = (230 + Math.random() * 40) * p;
    const bodyGain = c.createGain();
    bodyGain.gain.setValueAtTime(0.0001, t);
    bodyGain.gain.exponentialRampToValueAtTime(0.5 * P.body, t + 0.002);
    bodyGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    bodyGain.connect(out);
    [['sine', 1], ['triangle', 1.012]].forEach(([type, ratio]) => {
      const o = c.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(f0 * ratio, t);
      o.frequency.exponentialRampToValueAtTime(f0 * ratio * 0.36, t + 0.07);
      o.connect(bodyGain);
      o.start(t);
      o.stop(t + 0.1);
    });

    // 4) 여운: 공기가 빠지는 소리
    const tail = this._noise(t, 0.2, 'lowpass', 3000 * P.bright);
    tail.f.frequency.setValueAtTime(3000 * P.bright, t);
    tail.f.frequency.exponentialRampToValueAtTime(800, t + 0.1);
    tail.g.gain.setValueAtTime(0.0001, t);
    tail.g.gain.exponentialRampToValueAtTime(0.12 * P.tail, t + 0.005);
    tail.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11 + Math.random() * 0.03);
    tail.g.connect(out);

    this._release(out, pn, delay + 0.4);
  },

  // 가끔 섞이는 "빡!": 일반 뽁보다 훨씬 날카롭고 건조하게 갈라지는 소리
  bak(vol = 1, pan = 0) {
    const c = this.ctx;
    if (!c) return;
    const P = this.params;
    const t = c.currentTime;
    const { out, pn } = this._voice(vol * 0.85, pan);

    // 강하고 넓은 대역의 타격 (딱 갈라지는 느낌)
    const crack = this._noise(t, 0.08, 'highpass', 1800 * P.bright);
    crack.g.gain.setValueAtTime(0.0001, t);
    crack.g.gain.exponentialRampToValueAtTime(1, t + 0.0004);
    crack.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    crack.g.connect(out);

    // 중고음 몸통: 짧게 꽉 찬 "빡"
    const f1 = (1800 + Math.random() * 500) * P.pitch;
    const res = this._noise(t, 0.1, 'bandpass', f1, 2.5);
    res.g.gain.setValueAtTime(0.0001, t);
    res.g.gain.exponentialRampToValueAtTime(0.9, t + 0.0008);
    res.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    res.g.connect(out);

    // 짧고 단단한 저음 타격
    const lo = c.createOscillator();
    lo.type = 'sine';
    lo.frequency.setValueAtTime(190 * P.pitch, t);
    lo.frequency.exponentialRampToValueAtTime(60, t + 0.05);
    const lg = c.createGain();
    lg.gain.setValueAtTime(0.0001, t);
    lg.gain.exponentialRampToValueAtTime(0.7, t + 0.001);
    lg.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    lo.connect(lg).connect(out);
    lo.start(t);
    lo.stop(t + 0.08);

    this._release(out, pn, 0.3);
  },

  // 키보드 소리. kind: KEY_SWITCHES 키, size: 키 너비(1 = 보통 키, 스페이스바 6.25), down: 누름/뗌
  key(kind, size = 1, down = true, vol = 1, pan = 0) {
    const c = this.ctx;
    if (!c) return;
    const S = KEY_SWITCHES[kind];
    if (S.sample) return this._sample(size, down, vol, pan);
    const t = c.currentTime;
    const { out, pn } = this._voice(vol * 0.7, pan);
    let dest = out;                           // 청축은 살짝 눌러 주는 곡선을 거친다: 깨지지 않고 꽉 찬 타격감
    if (S.snappy) {
      dest = c.createWaveShaper();
      dest.curve = this._satCurve(); dest.oversample = '2x';
      dest.connect(out);
    }
    const jit = 0.95 + Math.random() * 0.1;   // 칠 때마다 살짝 다르게
    const sz = Math.pow(size, -0.25);         // 큰 키일수록 낮은 소리

    const env = (g, t0, peak, dur) => {
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + 0.0005);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    };
    const tick = (t0, f, peak, dur) => {      // 짧은 노이즈 "틱"
      const n = this._noise(t0, dur + 0.03, 'bandpass', f * jit, 2.5);
      env(n.g, t0, peak, dur);
      n.g.connect(dest);
    };
    const thump = (t0, f, peak, dur, drop) => { // 빠르게 내려가는 저음 "턱"
      const o = c.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, t0);
      o.frequency.exponentialRampToValueAtTime(f * drop, t0 + dur * 0.7);
      const g = c.createGain();
      env(g, t0, peak, dur);
      o.connect(g).connect(dest);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    };

    if (S.snappy) {
      const G = S.gain || 1, fs = Math.pow(size, -0.1); // 큰 키일수록 아주 조금 낮게
      // 쓸리듯 훑는 노이즈: 중심 주파수가 f0에서 f1로 빠르게 움직인다 ("찰"의 ㅊ 소리)
      const sweep = (t0, f0, f1, peak, dur, q) => {
        const n = this._noise(t0, dur + 0.03, 'bandpass', f0 * jit, q);
        n.f.frequency.setValueAtTime(f0 * jit, t0);
        n.f.frequency.exponentialRampToValueAtTime(f1 * jit, t0 + dur);
        env(n.g, t0, peak, dur);
        n.g.connect(dest);
      };
      if (down) {
        // 찰: 셔터가 쓸리는 듯한 맑고 밝은 스침 (3.5kHz에서 9kHz로 올라간다)
        sweep(t, 3500 * fs, 9000 * fs, 1.0 * G, 0.02, 1.5);
        tick(t, 6000 * fs, 0.6 * G, 0.012, 0.9);
        // 칵: 약 16ms 뒤 딱 걸리는 청량한 소리. 단단한 클릭 + 금속성 여운 + 반짝이는 고음
        const tb = t + 0.016;
        tick(tb, 3600 * fs, 1.0 * G, 0.008, 3.5);
        tick(tb, 2400 * fs, 0.8 * G, 0.012, 2.2);
        tick(tb, 5200 * fs, 0.55 * G, 0.025, 10);              // 금속성 여운
        tick(tb, 7200 * fs, 0.35 * G, 0.03, 12);               // 반짝이는 고음
        tick(tb, 1500 * fs, 0.55 * G, 0.02, 2.0);              // 타격음 (짧게)
        thump(tb, 480 * fs * jit, 0.12 * G, 0.015, 0.6);       // 아주 짧은 몸통: 저음이 답답하게 남지 않는다
        if (size >= 2) tick(tb + 0.012, 2400, 0.16 * G, 0.02);   // 스태빌라이저
      } else {
        // 뗄 때도 맑은 "찰칵" 한 번 더
        sweep(t, 3800 * fs, 8000 * fs, 0.55 * G, 0.014, 1.5);
        tick(t + 0.012, 3800 * fs, 0.7 * G, 0.007, 3.5);
        tick(t + 0.012, 5600 * fs, 0.35 * G, 0.014, 10);
      }
    } else if (down) {
      if (S.click > 0.01) {
        tick(t, S.clickF, S.click, 0.008);
        if (S.click2) tick(t + 0.008, S.clickF * 0.75, S.click * 0.7, 0.006); // 청축의 두 번 찰칵
      }
      const tb = t + S.gap; // 바닥까지 눌리는 순간
      thump(tb, S.thockF * sz * jit, S.thock, 0.07, 0.5);
      tick(tb, S.knockF * sz, S.knock, 0.03);
      if (size >= 2) tick(tb + 0.012, 1800, 0.12, 0.02);                    // 스태빌라이저 달그락
      if (size >= 6) thump(tb, 95, 0.6, 0.12, 0.6);                          // 스페이스바 묵직함
    } else {
      tick(t, Math.max(S.clickF, 2500) * 1.1, S.up, 0.006);
      thump(t, S.thockF * sz * 1.4, S.up * 0.4, 0.035, 0.6);
    }

    this._release(out, pn, 0.4);
  },

  // 목소리 하나(볼륨+패닝+리버브 전송)를 만들고 동시 발음 수를 관리한다
  _voice(gain, pan) {
    const c = this.ctx;
    // 초과하면 가장 오래된 소리를 빠르게 줄인다
    while (this.voices.length >= this.MAX_VOICES) {
      const old = this.voices.shift();
      old.gain.setTargetAtTime(0, c.currentTime, 0.02);
      setTimeout(() => old.disconnect(), 200);
    }
    const out = c.createGain();
    out.gain.value = gain;
    const pn = c.createStereoPanner();
    pn.pan.value = pan;
    out.connect(pn);
    pn.connect(this.dry);
    pn.connect(this.convIn);
    this.voices.push(out);
    return { out, pn };
  },

  _release(out, pn, seconds) {
    setTimeout(() => {
      out.disconnect(); pn.disconnect();
      const i = this.voices.indexOf(out);
      if (i >= 0) this.voices.splice(i, 1);
    }, seconds * 1000);
  },
};

/* ───────────── 튜닝 패널 (주소 뒤에 ?tune 을 붙이면 표시) ───────────── */
if (location.search.includes('tune')) {
  const KEY = 'asmrTune';
  try { Object.assign(Sound.params, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(Sound.params)); } catch (e) {} };
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;right:12px;bottom:12px;width:220px;padding:12px;border-radius:12px;background:rgba(0,0,0,.55);color:#e8ecf7;font-size:12px;z-index:9';
  const defs = [
    ['pitch', '음높이', 0.6, 1.6, 0.01],
    ['bright', '밝기', 0.5, 1.8, 0.01],
    ['body', '몸통(저음)', 0, 2, 0.01],
    ['tail', '여운', 0, 3, 0.01],
    ['reverb', '울림', 0, 0.5, 0.01],
  ];
  for (const [key, label, min, max, step] of defs) {
    const row = document.createElement('label');
    row.style.cssText = 'display:block;margin-bottom:6px';
    const val = document.createElement('span');
    val.style.float = 'right';
    val.textContent = Sound.params[key];
    const input = document.createElement('input');
    input.type = 'range'; input.min = min; input.max = max; input.step = step;
    input.value = Sound.params[key];
    input.style.cssText = 'width:100%;display:block';
    input.addEventListener('input', () => {
      const v = parseFloat(input.value);
      if (key === 'reverb') Sound.setReverb(v); else Sound.params[key] = v;
      val.textContent = v.toFixed(2);
      save();
    });
    row.append(label, val, input);
    box.append(row);
  }
  const btn = document.createElement('button');
  btn.textContent = '▶ 소리 듣기';
  btn.style.cssText = 'width:100%;padding:8px;border:0;border-radius:8px;background:rgba(255,255,255,.18);color:inherit;font:inherit;cursor:pointer';
  btn.addEventListener('click', () => { Sound.unlock(); Sound.pop(1, 1, 0); });
  const copy = document.createElement('button');
  copy.textContent = '📋 값 복사';
  copy.style.cssText = btn.style.cssText + ';margin-top:6px';
  copy.addEventListener('click', () => {
    const text = JSON.stringify(Sound.params);
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
      () => { copy.textContent = '복사됨! ' + text; },
      () => { copy.textContent = text; }
    );
  });
  box.append(btn, copy);
  document.addEventListener('DOMContentLoaded', () => document.body.append(box));
}

// 미리 그려 두는 그림(텍스처)용 캔버스. 화면 배율에 맞춰 선명하게 만든다.
function mkTex(wCss, hCss) {
  const s = Math.min(2, window.devicePixelRatio || 1);
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.ceil(wCss * s)); cv.height = Math.max(1, Math.ceil(hCss * s));
  const c = cv.getContext('2d');
  c.scale(s, s);
  return { cv, c, s };
}

/* ───────────── 뽁뽁이 씬 ───────────── */
const BubbleWrap = {
  bubbles: [],
  particles: [],
  popped: 0,
  lastBak: 0,
  hint: '터치하거나 드래그해서 터뜨려 보세요',
  resetLabel: '새 뽁뽁이',

  init(w, h) {
    this.bubbles = [];
    this.particles = [];
    this.popped = 0;
    const d = Math.max(46, Math.min(72, Math.min(w, h) / 9)); // 지름
    const r = d / 2;
    const rowH = d * 0.9;
    const top = 60, bottom = 40;
    const rows = Math.max(1, Math.floor((h - top - bottom) / rowH));
    const cols = Math.max(1, Math.floor((w - 16) / d));
    const ox = (w - cols * d) / 2 + r;
    const oy = top + (h - top - bottom - (rows - 1) * rowH) / 2;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        this.bubbles.push({
          x: ox + x * d + (y % 2 ? r * 0.5 : 0) - (y % 2 ? r * 0.25 : -r * 0.25),
          y: oy + y * rowH,
          r: r * 0.92,
          popped: false,
          v: Math.floor(Math.random() * 6),   // 터진 모양 변형
          anim: 1,          // 터진 뒤 0→1 로 진행되는 애니메이션
        });
      }
    }
    this.R = r * 0.92;
    this.buildTextures(w, h);
    UI.setCount(0, this.bubbles.length);
  },

  onDown(x, y, speed) { this.hit(x, y, speed); },
  onMove(x, y, speed) { this.hit(x, y, speed); },
  onUp() {},

  hit(x, y, speed) {
    for (const b of this.bubbles) {
      if (b.popped) continue;
      const dx = x - b.x, dy = y - b.y;
      if (dx * dx + dy * dy <= b.r * b.r) this.pop(b, speed);
    }
  },

  pop(b, speed) {
    b.popped = true;
    b.anim = 0;
    this.popped++;
    UI.setCount(this.popped, this.bubbles.length);
    // 빠르게 문지를수록 세게, 피치는 약간 랜덤
    const vol = Math.min(1, 0.5 + speed * 0.0004) * (0.85 + Math.random() * 0.15);
    const pan = Math.max(-0.8, Math.min(0.8, (b.x / W) * 2 - 1));
    const delay = Math.random() * Math.min(0.008, speed * 0.00001); // 빠른 드래그 시 위상 겹침 방지
    // 가끔(약 7%) "빡!" 소리. 연달아 나오지 않게 0.5초 간격을 둔다
    const now = performance.now();
    if (now - this.lastBak > 500 && Math.random() < 0.07) {
      this.lastBak = now;
      Sound.bak(Math.max(0.85, vol), pan);
    } else {
      Sound.pop(vol, 0.85 + Math.random() * 0.3, pan, delay);
    }
    if (navigator.vibrate) navigator.vibrate(6);
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2, s = 50 + Math.random() * 110;
      this.particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14, s: 2 + Math.random() * 3.5 });
    }
  },

  update(dt) {
    for (const b of this.bubbles) if (b.anim < 1) b.anim = Math.min(1, b.anim + dt * 6);
    for (const p of this.particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += (p.vr || 0) * dt;
      p.vx *= 0.9; p.vy *= 0.9;
      p.life -= dt * 3;
    }
    this.particles = this.particles.filter(p => p.life > 0);
  },

  // ── 사실적인 렌더링: 그림을 미리 그려 두고 프레임마다 붙이기만 한다 ──
  buildTextures(w, h) {
    this.bg = this.buildBg(w, h);
    this.intact = this.buildIntact(this.R);
    this.popTex = Array.from({ length: 6 }, () => this.buildPopped(this.R));
  },

  // 배경: 어두운 책상 위 조명, 비닐 시트의 반사 줄무늬와 주름, 돔 밑동의 이음선, 가장자리 비네트
  buildBg(w, h) {
    const { cv, c } = mkTex(w, h);
    const R = this.R, rnd = Math.random;
    let g = c.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#34445f'); g.addColorStop(0.55, '#222c45'); g.addColorStop(1, '#131a2b');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    g = c.createRadialGradient(w * 0.28, h * 0.16, 0, w * 0.28, h * 0.16, Math.max(w, h) * 0.75);
    g.addColorStop(0, 'rgba(190,215,255,0.24)'); g.addColorStop(1, 'rgba(190,215,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    for (let i = 0; i < (w * h) / 60; i++) { // 표면의 미세한 결
      c.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.05)';
      c.fillRect(rnd() * w, rnd() * h, 1, 1);
    }
    // 비닐 시트: 창문 빛이 비스듬히 지나가는 반사 줄무늬
    c.save(); c.translate(w * 0.5, h * 0.5); c.rotate(-0.55);
    for (const [x, wd, a] of [[-w * 0.35, w * 0.16, 0.07], [w * 0.05, w * 0.06, 0.09], [w * 0.3, w * 0.12, 0.05]]) {
      const lg = c.createLinearGradient(x - wd, 0, x + wd, 0);
      lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, `rgba(255,255,255,${a})`); lg.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = lg; c.fillRect(x - wd, -h * 2, wd * 2, h * 4);
    }
    c.restore();
    // 시트의 긴 주름 (어두운 선 + 밝은 선을 겹쳐 볼록해 보이게)
    for (let i = 0; i < 16; i++) {
      const x0 = rnd() * w, y0 = rnd() * h, ang = rnd() * Math.PI, len = 80 + rnd() * 220, bend = (rnd() - 0.5) * 60;
      const x1 = x0 + Math.cos(ang) * len, y1 = y0 + Math.sin(ang) * len;
      c.lineWidth = 1.2; c.strokeStyle = 'rgba(0,0,0,0.10)';
      c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo((x0 + x1) / 2 + bend, (y0 + y1) / 2 - bend, x1, y1); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,0.07)';
      c.beginPath(); c.moveTo(x0 + 1, y0 + 1); c.quadraticCurveTo((x0 + x1) / 2 + bend + 1, (y0 + y1) / 2 - bend + 1, x1 + 1, y1 + 1); c.stroke();
    }
    // 돔 밑동의 이음선 (눌러 찍어 낸 자리)
    for (const b of this.bubbles) {
      c.lineWidth = 2; c.strokeStyle = 'rgba(0,0,0,0.22)';
      c.beginPath(); c.arc(b.x, b.y, R * 1.03, 0, Math.PI * 2); c.stroke();
      c.lineWidth = 1.4; c.strokeStyle = 'rgba(255,255,255,0.13)';
      c.beginPath(); c.arc(b.x, b.y, R * 1.07, Math.PI * 0.9, Math.PI * 1.6); c.stroke();
    }
    g = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.5)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    return cv;
  },

  // 멀쩡한 돔: 그림자, 유리 같은 두께 있는 가장자리, 굴절, 빛이 모이는 자리, 창문 모양 반사광
  buildIntact(R) {
    const pad = R * 0.55, S = 2 * (R + pad);
    const { cv, c } = mkTex(S, S);
    const cx = S / 2, cy = S / 2;
    let g = c.createRadialGradient(cx + R * 0.16, cy + R * 0.24, R * 0.3, cx + R * 0.16, cy + R * 0.24, R * 1.35);
    g.addColorStop(0, 'rgba(0,0,0,0.4)'); g.addColorStop(0.7, 'rgba(0,0,0,0.16)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.beginPath(); c.arc(cx + R * 0.16, cy + R * 0.24, R * 1.35, 0, Math.PI * 2); c.fill();
    c.save();
    c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.clip();
    g = c.createRadialGradient(cx - R * 0.1, cy - R * 0.12, R * 0.05, cx, cy, R);
    g.addColorStop(0, 'rgba(210,230,255,0.05)'); g.addColorStop(0.6, 'rgba(170,205,245,0.09)');
    g.addColorStop(0.88, 'rgba(190,220,255,0.25)'); g.addColorStop(1, 'rgba(235,247,255,0.52)');
    c.fillStyle = g; c.fillRect(0, 0, S, S);
    // 굴절: 빛이 오는 왼쪽 위 안쪽은 어둡고, 반대편에는 빛이 모여 밝다
    g = c.createRadialGradient(cx - R * 0.55, cy - R * 0.55, R * 0.2, cx - R * 0.55, cy - R * 0.55, R * 1.5);
    g.addColorStop(0, 'rgba(10,25,60,0.24)'); g.addColorStop(0.55, 'rgba(10,25,60,0.06)'); g.addColorStop(1, 'rgba(10,25,60,0)');
    c.fillStyle = g; c.fillRect(0, 0, S, S);
    g = c.createRadialGradient(cx + R * 0.5, cy + R * 0.55, 0, cx + R * 0.5, cy + R * 0.55, R * 0.75);
    g.addColorStop(0, 'rgba(255,255,255,0.42)'); g.addColorStop(0.5, 'rgba(220,240,255,0.13)'); g.addColorStop(1, 'rgba(220,240,255,0)');
    c.fillStyle = g; c.fillRect(0, 0, S, S);
    // 창문 모양 반사광 (두 칸)
    c.save(); c.translate(cx - R * 0.36, cy - R * 0.42); c.rotate(-0.6);
    const soft = c.createRadialGradient(0, 0, 0, 0, 0, R * 0.55);
    soft.addColorStop(0, 'rgba(255,255,255,0.22)'); soft.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = soft; c.fillRect(-R * 0.6, -R * 0.6, R * 1.2, R * 1.2);
    for (let i = 0; i < 2; i++) {
      const x = -R * 0.3 + i * R * 0.32, y = -R * 0.09, w = R * 0.28, h = R * 0.17;
      const pg = c.createLinearGradient(0, y, 0, y + h);
      pg.addColorStop(0, 'rgba(255,255,255,0.92)'); pg.addColorStop(1, 'rgba(255,255,255,0.4)');
      c.fillStyle = pg; roundRect(c, x, y, w, h, R * 0.045); c.fill();
    }
    c.restore();
    c.restore();
    // 가장자리: 두께 있는 투명 플라스틱의 굵은 테두리와 빛
    const eg = c.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    eg.addColorStop(0, 'rgba(255,255,255,0.85)'); eg.addColorStop(0.5, 'rgba(180,210,240,0.28)'); eg.addColorStop(1, 'rgba(255,255,255,0.6)');
    c.lineWidth = Math.max(1.4, R * 0.055); c.strokeStyle = eg;
    c.beginPath(); c.arc(cx, cy, R - c.lineWidth / 2, 0, Math.PI * 2); c.stroke();
    c.lineCap = 'round';
    c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = R * 0.05;
    c.beginPath(); c.arc(cx, cy, R * 0.86, Math.PI * 1.08, Math.PI * 1.42); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.32)'; c.lineWidth = R * 0.035;
    c.beginPath(); c.arc(cx, cy, R * 0.88, Math.PI * 0.05, Math.PI * 0.4); c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.9)';
    c.beginPath(); c.arc(cx - R * 0.16, cy - R * 0.64, R * 0.045, 0, Math.PI * 2); c.fill();
    return { cv, S };
  },

  // 터진 돔: 납작하게 눌려 구겨진 비닐. 밝고 어두운 주름, 찢어진 구멍, 주름 봉우리의 반짝임
  buildPopped(R) {
    const S = R * 2.6, cx = S / 2, cy = S / 2, rnd = Math.random;
    const { cv, c } = mkTex(S, S);
    const n = 22, rr = R * 0.92;
    const pts = Array.from({ length: n }, (_, i) => { const a = (i / n) * Math.PI * 2, r = rr * (0.95 + rnd() * 0.08); return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });
    const path = () => { // 점들을 부드러운 곡선으로 이어 오려 낸 느낌이 나지 않게 한다
      c.beginPath();
      const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], m0 = mid(pts[n - 1], pts[0]);
      c.moveTo(m0[0], m0[1]);
      for (let i = 0; i < n; i++) { const q = pts[i], m = mid(q, pts[(i + 1) % n]); c.quadraticCurveTo(q[0], q[1], m[0], m[1]); }
      c.closePath();
    };
    path();
    const fg = c.createRadialGradient(cx, cy, rr * 0.2, cx, cy, rr);
    fg.addColorStop(0, 'rgba(140,170,205,0.10)'); fg.addColorStop(1, 'rgba(140,170,205,0.17)');
    c.fillStyle = fg; c.fill();
    c.save(); path(); c.clip();
    let g = c.createRadialGradient(cx - R * 0.2, cy - R * 0.2, R * 0.1, cx, cy, rr);
    g.addColorStop(0, 'rgba(255,255,255,0.05)'); g.addColorStop(1, 'rgba(10,25,60,0.16)');
    c.fillStyle = g; c.fillRect(0, 0, S, S);
    c.lineCap = 'round';
    for (let k = 0; k < 8; k++) { // 주름: 부드럽게 휘어진 어두운 선 + 옆에 밝은 선 (깨진 유리가 아니라 구겨진 비닐)
      const a0 = rnd() * Math.PI * 2, r0 = rnd() * rr * 0.55, a1 = a0 + (rnd() - 0.5) * 2.0, r1 = rr * (0.4 + rnd() * 0.5);
      const x0 = cx + Math.cos(a0) * r0, y0 = cy + Math.sin(a0) * r0, x1 = cx + Math.cos(a1) * r1, y1 = cy + Math.sin(a1) * r1;
      const j = R * 0.55;
      const c1x = x0 + (rnd() - 0.5) * j * 2, c1y = y0 + (rnd() - 0.5) * j * 2, c2x = x1 + (rnd() - 0.5) * j * 2, c2y = y1 + (rnd() - 0.5) * j * 2;
      c.lineWidth = 1.5; c.strokeStyle = 'rgba(12,28,55,0.16)';           // 넓고 옅은 그림자 띠
      c.beginPath(); c.moveTo(x0, y0); c.bezierCurveTo(c1x, c1y, c2x, c2y, x1, y1); c.stroke();
      c.lineWidth = 0.9; c.strokeStyle = 'rgba(12,28,55,0.2)';
      c.beginPath(); c.moveTo(x0, y0); c.bezierCurveTo(c1x, c1y, c2x, c2y, x1, y1); c.stroke();
      c.lineWidth = 0.9; c.strokeStyle = 'rgba(255,255,255,0.26)';
      c.beginPath(); c.moveTo(x0 + 1.4, y0 + 1.4); c.bezierCurveTo(c1x + 1.4, c1y + 1.4, c2x + 1.4, c2y + 1.4, x1 + 1.4, y1 + 1.4); c.stroke();
    }
    for (let k = 0; k < 7; k++) { // 주름 봉우리에 걸린 빛
      const a = rnd() * Math.PI * 2, r = rnd() * rr * 0.75;
      c.fillStyle = `rgba(255,255,255,${0.3 + rnd() * 0.3})`;
      c.beginPath(); c.ellipse(cx + Math.cos(a) * r, cy + Math.sin(a) * r, R * (0.03 + rnd() * 0.05), R * 0.018, rnd() * 3, 0, Math.PI * 2); c.fill();
    }
    c.restore();
    // 터지면서 생긴 찢어진 구멍
    const ta = rnd() * Math.PI * 2, tx = cx + Math.cos(ta) * rr * 0.42, ty = cy + Math.sin(ta) * rr * 0.42, rot = rnd() * Math.PI;
    c.save(); c.translate(tx, ty); c.rotate(rot);
    c.fillStyle = 'rgba(4,10,26,0.6)'; c.beginPath(); c.ellipse(0, 0, R * 0.16, R * 0.05, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 1;
    c.beginPath(); c.ellipse(0, 0, R * 0.17, R * 0.06, 0, Math.PI * 0.1, Math.PI * 0.9); c.stroke();
    c.restore();
    path(); c.lineWidth = 1.2; c.strokeStyle = 'rgba(230,245,255,0.15)'; c.stroke();
    return { cv, S };
  },

  draw(ctx, w, h) {
    ctx.drawImage(this.bg, 0, 0, w, h);
    const I = this.intact, hs = I.S / 2;
    for (const b of this.bubbles) {
      if (!b.popped) { ctx.drawImage(I.cv, b.x - hs, b.y - hs, I.S, I.S); continue; }
      const P = this.popTex[b.v], k = b.anim, ps = P.S / 2;
      ctx.globalAlpha = Math.min(1, 0.2 + k * 2.5);
      ctx.drawImage(P.cv, b.x - ps, b.y - ps, P.S, P.S);
      ctx.globalAlpha = 1;
      if (k < 1) { // 터지는 순간: 돔이 순간 부풀며 사라지고 충격 고리가 퍼진다
        const s = 1 + 0.22 * k, q = I.S * s / 2;
        ctx.globalAlpha = (1 - k) * (1 - k);
        ctx.drawImage(I.cv, b.x - q, b.y - q, q * 2, q * 2);
        ctx.globalAlpha = 0.7 * (1 - k);
        ctx.strokeStyle = '#eaf4ff'; ctx.lineWidth = 0.6 + 2 * (1 - k);
        ctx.beginPath(); ctx.arc(b.x, b.y, this.R * (1 + 0.55 * k), 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
    for (const p of this.particles) { // 튀는 비닐 조각
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = `rgba(235,245,255,${Math.max(0, p.life) * 0.85})`;
      ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  },

  isDone() { return this.popped === this.bubbles.length && this.bubbles.length > 0; },
};

/* ───────────── 키보드 씬 ───────────── */
const KEYBOARD_ROWS = (() => {
  const K = s => [...s].map(ch => ['Key' + ch, ch]);
  const D = s => [...s].map(ch => ['Digit' + ch, ch]);
  return [
    [['Backquote', '`'], ...D('1234567890'), ['Minus', '-'], ['Equal', '='], ['Backspace', '⌫', 2]],
    [['Tab', 'Tab', 1.5], ...K('QWERTYUIOP'), ['BracketLeft', '['], ['BracketRight', ']'], ['Backslash', '\\', 1.5]],
    [['CapsLock', 'Caps', 1.75], ...K('ASDFGHJKL'), ['Semicolon', ';'], ['Quote', "'"], ['Enter', 'Enter', 2.25]],
    [['ShiftLeft', 'Shift', 2.25], ...K('ZXCVBNM'), ['Comma', ','], ['Period', '.'], ['Slash', '/'], ['ShiftRight', 'Shift', 2.75]],
    [['ControlLeft', 'Ctrl', 1.25], ['MetaLeft', '⌘', 1.25], ['AltLeft', 'Alt', 1.25], ['Space', '', 6.25],
     ['AltRight', 'Alt', 1.25], ['MetaRight', '⌘', 1.25], ['ContextMenu', '☰', 1.25], ['ControlRight', 'Ctrl', 1.25]],
  ];
})();

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const Keyboard = {
  hint: '키를 누르거나 드래그해 보세요 · 진짜 키보드로도 칠 수 있어요',
  resetLabel: null,
  kind: 'real',
  keys: [],
  byCode: {},
  held: new Map(),   // pointerId -> 그 포인터가 누르고 있는 키(없으면 null)
  presses: 0,
  u: 0,
  board: null,

  init(w, h) {
    this.keys = [];
    this.byCode = {};
    this.held.clear();
    const u = Math.max(14, Math.min(64, (w - 24) / 15.6, (h - 200) / 5.6));
    const cp = u * 0.3;
    const bw = 15 * u + cp * 2, bh = 5 * u + cp * 2;
    const bx = (w - bw) / 2, by = (h - bh) / 2 + 24;
    this.u = u;
    this.board = { x: bx, y: by, w: bw, h: bh, r: u * 0.35 };
    KEYBOARD_ROWS.forEach((row, ri) => {
      let xu = 0;
      for (const [code, label, wu = 1] of row) {
        const cell = { x: bx + cp + xu * u, y: by + cp + ri * u, w: wu * u, h: u };
        const key = {
          code, label, wu, cell,
          mod: wu > 1 && code !== 'Space' || /^(Ctrl|Alt|⌘|☰|Caps)$/.test(label),
          down: false, owner: null, depth: 0, glow: 0,
        };
        this.keys.push(key);
        this.byCode[code] = key;
        xu += wu;
      }
    });
    this.buildTextures(w, h);
    this.updateCount();
  },

  updateCount() { UI.setText(`${this.presses}번 눌렀어요`); },

  hitTest(x, y) {
    for (const k of this.keys) {
      const c = k.cell;
      if (x >= c.x && x < c.x + c.w && y >= c.y && y < c.y + c.h) return k;
    }
    return null;
  },

  press(key, owner) {
    if (key.down) return false;
    key.down = true; key.owner = owner; key.glow = 1;
    this.presses++;
    this.updateCount();
    const cx = key.cell.x + key.cell.w / 2;
    const pan = Math.max(-0.7, Math.min(0.7, (cx / W) * 2 - 1));
    Sound.key(this.kind, key.wu, true, 0.75 + Math.random() * 0.25, pan);
    if (navigator.vibrate) navigator.vibrate(3);
    return true;
  },

  release(key, silent) {
    if (!key.down) return;
    key.down = false; key.owner = null;
    if (silent) return;
    const cx = key.cell.x + key.cell.w / 2;
    const pan = Math.max(-0.7, Math.min(0.7, (cx / W) * 2 - 1));
    Sound.key(this.kind, key.wu, false, 0.6, pan);
  },

  releaseAll() {
    for (const k of this.keys) this.release(k, true);
    this.held.clear();
  },

  // 드래그하면 손가락이 지나가는 키를 차례로 누르고 뗀다
  onDown(x, y, speed, id) {
    const k = this.hitTest(x, y);
    this.held.set(id, k && this.press(k, id) ? k : null);
  },
  onMove(x, y, speed, id) {
    if (!this.held.has(id)) return;
    const cur = this.held.get(id);
    const k = this.hitTest(x, y);
    if (k === cur) return;
    if (cur) this.release(cur);
    this.held.set(id, k && this.press(k, id) ? k : null);
  },
  onUp(id) {
    const cur = this.held.get(id);
    if (cur && cur.owner === id) this.release(cur);
    this.held.delete(id);
  },

  // 실제 키보드 (e.code는 물리 키 위치라서 한글 입력 상태에서도 동작한다)
  onKeyDown(code) {
    const k = this.byCode[code];
    if (!k) return false;
    this.press(k, 'kbd');
    return true;
  },
  onKeyUp(code) {
    const k = this.byCode[code];
    if (k && k.owner === 'kbd') this.release(k);
  },

  mount(sub) {
    for (const [id, s] of Object.entries(KEY_SWITCHES)) {
      const b = document.createElement('button');
      b.className = 'chip' + (id === this.kind ? ' on' : '');
      b.textContent = s.name;
      b.addEventListener('click', () => {
        this.kind = id;
        sub.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
        Sound.unlock();
        Sound.key(id, 1, true, 0.8, 0);                       // 미리 듣기
        setTimeout(() => Sound.key(id, 1, false, 0.6, 0), 110);
      });
      sub.append(b);
    }
  },
  unmount() { this.releaseAll(); },

  update(dt) {
    const k = Math.min(1, dt * 30);
    for (const key of this.keys) {
      key.depth += ((key.down ? 1 : 0) - key.depth) * k;
      if (key.glow > 0) key.glow = Math.max(0, key.glow - dt * 2.5);
    }
  },

  // ── 사실적인 렌더링: 책상, 알루미늄 본체, 키캡을 미리 그려 두고 프레임마다 붙인다 ──
  buildTextures(w, h) {
    this.bgTex = this.buildBoard(w, h);
    const gap = this.u * 0.09;
    for (const key of this.keys) key.tex = this.buildKeycap(key, gap);
  },

  // 책상 + 그림자 + 브러시드 알루미늄 본체 + 키 아래 판(RGB 백라이트) + 키가 들어가는 홈 + 나사
  buildBoard(w, h) {
    const { cv, c } = mkTex(w, h);
    const b = this.board, u = this.u, rnd = Math.random;
    // 책상: 어두운 자주빛 천/나무 결과 조명
    let g = c.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#2d2538'); g.addColorStop(1, '#14101c');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    g = c.createRadialGradient(w * 0.5, h * 0.35, 0, w * 0.5, h * 0.35, Math.max(w, h) * 0.8);
    g.addColorStop(0, 'rgba(255,225,190,0.16)'); g.addColorStop(1, 'rgba(255,225,190,0)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    for (let i = 0; i < (w * h) / 70; i++) { c.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.05)'; c.fillRect(rnd() * w, rnd() * h, 1, 1); }
    // 본체 그림자
    c.save();
    c.shadowColor = 'rgba(0,0,0,0.6)'; c.shadowBlur = u * 0.9; c.shadowOffsetY = u * 0.35;
    c.fillStyle = '#000'; roundRect(c, b.x, b.y, b.w, b.h, b.r); c.fill();
    c.restore();
    // 알루미늄 본체
    g = c.createLinearGradient(0, b.y, 0, b.y + b.h);
    g.addColorStop(0, '#a3abbd'); g.addColorStop(0.45, '#737b8f'); g.addColorStop(1, '#474e62');
    c.fillStyle = g; roundRect(c, b.x, b.y, b.w, b.h, b.r); c.fill();
    c.save(); roundRect(c, b.x, b.y, b.w, b.h, b.r); c.clip();
    for (let i = 0; i < b.h * 4; i++) { // 브러시드(결) 무늬
      c.fillStyle = rnd() < 0.5 ? `rgba(255,255,255,${0.02 + rnd() * 0.05})` : `rgba(0,0,0,${0.02 + rnd() * 0.05})`;
      c.fillRect(b.x + rnd() * b.w * 0.4, b.y + rnd() * b.h, b.w * (0.15 + rnd() * 0.6), 1);
    }
    c.restore();
    const cg = c.createLinearGradient(0, b.y, 0, b.y + b.h); // 모서리를 깎은 면(챔퍼)의 빛
    cg.addColorStop(0, 'rgba(255,255,255,0.75)'); cg.addColorStop(0.3, 'rgba(255,255,255,0.05)'); cg.addColorStop(0.7, 'rgba(0,0,0,0.05)'); cg.addColorStop(1, 'rgba(0,0,0,0.4)');
    c.lineWidth = 2; c.strokeStyle = cg;
    roundRect(c, b.x + 1, b.y + 1, b.w - 2, b.h - 2, b.r); c.stroke();
    // 키 아래 판
    const pad = u * 0.17, px = b.x + pad, py = b.y + pad, pw = b.w - pad * 2, ph = b.h - pad * 2;
    c.fillStyle = '#0d0f17'; roundRect(c, px, py, pw, ph, b.r * 0.55); c.fill();
    c.save(); roundRect(c, px, py, pw, ph, b.r * 0.55); c.clip();
    const lg = c.createLinearGradient(px, 0, px + pw, 0); // RGB 백라이트가 판 아래에서 은은하게 번진다
    for (let i = 0; i <= 6; i++) lg.addColorStop(i / 6, `hsla(${i * 55},90%,60%,0.16)`);
    c.fillStyle = lg; c.fillRect(px, py, pw, ph);
    const ig = c.createLinearGradient(0, py, 0, py + ph); // 판 안쪽 그림자
    ig.addColorStop(0, 'rgba(0,0,0,0.5)'); ig.addColorStop(0.25, 'rgba(0,0,0,0)'); ig.addColorStop(1, 'rgba(0,0,0,0.25)');
    c.fillStyle = ig; c.fillRect(px, py, pw, ph);
    // 키가 들어가는 홈: 어둡게 파여 있고 빛이 살짝 새어 나온다
    const gap = u * 0.09;
    for (const k of this.keys) {
      const cl = k.cell, x = cl.x + gap / 2 - u * 0.03, y = cl.y + gap / 2 - u * 0.01, wd = cl.w - gap + u * 0.06, ht = cl.h - gap + u * 0.05;
      c.fillStyle = 'rgba(0,0,0,0.6)'; roundRect(c, x, y, wd, ht, u * 0.17); c.fill();
      const hue = ((cl.x + cl.w / 2 - b.x) / b.w) * 330;
      const gg = c.createLinearGradient(0, y + ht * 0.6, 0, y + ht);
      gg.addColorStop(0, 'rgba(0,0,0,0)'); gg.addColorStop(1, `hsla(${hue},95%,62%,0.28)`);
      c.fillStyle = gg; roundRect(c, x, y, wd, ht, u * 0.17); c.fill();
    }
    c.restore();
    // 나사
    for (const [sx, sy] of [[b.x + pad * 0.5, b.y + pad * 0.5], [b.x + b.w - pad * 0.5, b.y + pad * 0.5], [b.x + pad * 0.5, b.y + b.h - pad * 0.5], [b.x + b.w - pad * 0.5, b.y + b.h - pad * 0.5]]) {
      const r = Math.max(2, u * 0.07), sg = c.createRadialGradient(sx - r * 0.3, sy - r * 0.3, 0, sx, sy, r);
      sg.addColorStop(0, '#c8cfdc'); sg.addColorStop(1, '#5b6376');
      c.fillStyle = sg; c.beginPath(); c.arc(sx, sy, r, 0, Math.PI * 2); c.fill();
      c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(sx - r * 0.7, sy + r * 0.2); c.lineTo(sx + r * 0.7, sy - r * 0.2); c.stroke();
    }
    return cv;
  },

  // 키캡 한 개: 옆면(스커트), 오목하게 파인 윗면, 결 질감, 모서리 빛, 각인된 글자
  buildKeycap(key, gap) {
    const u = this.u, cl = key.cell, w = cl.w - gap, hF = cl.h - gap, m = 3, rnd = Math.random;
    const { cv, c } = mkTex(w + m * 2, hF + m * 2);
    c.translate(m, m);
    const SCHEMES = {
      alpha: { hi: '#f4f0e6', base: '#e3ded1', lo: '#cbc5b5', skA: '#b8b2a2', skB: '#8e8876', legend: '#3a3a44' },
      mod:   { hi: '#5b6582', base: '#474f6a', lo: '#363e56', skA: '#2f364a', skB: '#1f2537', legend: '#e2e7f5' },
      acc:   { hi: '#f38d6a', base: '#e2724f', lo: '#c45b3c', skA: '#a64b31', skB: '#7e3823', legend: '#fff2e8' },
    };
    const S = SCHEMES[key.code === 'Enter' || key.code === 'Backspace' ? 'acc' : key.mod ? 'mod' : 'alpha'];
    const skirt = u * 0.17, ins = u * 0.07, top = u * 0.03, rad = u * 0.16;
    // 옆면(스커트): 아래로 갈수록 어둡다
    let g = c.createLinearGradient(0, 0, 0, hF);
    g.addColorStop(0, S.skA); g.addColorStop(1, S.skB);
    c.fillStyle = g; roundRect(c, 0, 0, w, hF, rad); c.fill();
    // 윗면
    const tx = ins, ty = top, tw = w - ins * 2, th = hF - skirt - top - u * 0.02;
    const facePath = () => roundRect(c, tx, ty, tw, th, rad * 0.85);
    facePath();
    g = c.createLinearGradient(tx, ty, tx + tw, ty + th);
    g.addColorStop(0, S.hi); g.addColorStop(0.5, S.base); g.addColorStop(1, S.lo);
    c.fillStyle = g; c.fill();
    c.save(); facePath(); c.clip();
    // 오목한 접시 모양: 가운데가 살짝 어둡고 가장자리가 밝다
    g = c.createRadialGradient(tx + tw / 2, ty + th * 0.58, 0, tx + tw / 2, ty + th * 0.58, Math.max(tw, th) * 0.62);
    g.addColorStop(0, 'rgba(0,0,0,0.10)'); g.addColorStop(0.7, 'rgba(0,0,0,0.02)'); g.addColorStop(1, 'rgba(255,255,255,0.11)');
    c.fillStyle = g; c.fillRect(tx, ty, tw, th);
    for (let i = 0; i < (tw * th) / 5; i++) { // 표면 결(PBT 질감)
      c.fillStyle = rnd() < 0.5 ? `rgba(0,0,0,${0.03 + rnd() * 0.05})` : `rgba(255,255,255,${0.04 + rnd() * 0.06})`;
      c.fillRect(tx + rnd() * tw, ty + rnd() * th, 0.7 + rnd() * 0.5, 0.7 + rnd() * 0.5);
    }
    g = c.createLinearGradient(tx, ty, tx + tw * 0.7, ty + th * 0.9); // 위쪽 광택
    g.addColorStop(0, 'rgba(255,255,255,0.24)'); g.addColorStop(0.45, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.fillRect(tx, ty, tw, th);
    c.restore();
    // 윗면 테두리: 위·왼쪽은 밝고 아래·오른쪽은 어둡다
    facePath();
    g = c.createLinearGradient(tx, ty, tx + tw, ty + th);
    g.addColorStop(0, 'rgba(255,255,255,0.6)'); g.addColorStop(0.5, 'rgba(255,255,255,0.05)'); g.addColorStop(1, 'rgba(0,0,0,0.3)');
    c.lineWidth = 1.2; c.strokeStyle = g; c.stroke();
    // 스커트 윗줄에 걸리는 빛
    c.strokeStyle = 'rgba(255,255,255,0.18)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(rad, hF - skirt - 0.5); c.lineTo(w - rad, hF - skirt - 0.5); c.stroke();
    // 각인된 글자
    if (key.label) {
      c.font = `600 ${Math.round(u * (key.label.length > 1 ? 0.25 : 0.34))}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      const lx = tx + tw / 2, ly = ty + th * 0.5;
      c.fillStyle = 'rgba(255,255,255,0.35)'; c.fillText(key.label, lx, ly + 0.8);
      c.fillStyle = S.legend; c.fillText(key.label, lx, ly);
    }
    return { cv, w: w + m * 2, h: hF + m * 2, x: cl.x + gap / 2 - m, y: cl.y + gap / 2 - m };
  },

  draw(ctx, w, h) {
    ctx.drawImage(this.bgTex, 0, 0, w, h);
    const u = this.u, travel = u * 0.11, b = this.board;
    // 1) 백라이트 빛을 먼저 모두 깔고, 2) 그 위에 키캡을 올린다 (빛이 이웃 키캡을 하얗게 덮지 않게)
    ctx.globalCompositeOperation = 'lighter';
    for (const key of this.keys) {
      const glow = Math.max(key.glow * 0.9, key.depth * 0.45);
      if (glow <= 0.02) continue;
      const cl = key.cell, hue = ((cl.x + cl.w / 2 - b.x) / b.w) * 330, cx = cl.x + cl.w / 2, cy = cl.y + cl.h / 2, rad = Math.max(cl.w, cl.h) * 1.1;
      const g = ctx.createRadialGradient(cx, cy, rad * 0.15, cx, cy, rad);
      g.addColorStop(0, `hsla(${hue},95%,62%,${0.42 * glow})`); g.addColorStop(1, `hsla(${hue},95%,62%,0)`);
      ctx.fillStyle = g; ctx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
    for (const key of this.keys) {
      const T = key.tex;
      ctx.drawImage(T.cv, T.x, T.y + key.depth * travel, T.w, T.h);
      const glow = Math.max(key.glow * 0.9, key.depth * 0.45); // 눌린 키캡의 윗면만 빛을 살짝 받는다
      if (glow > 0.02) {
        const cl = key.cell, hue = ((cl.x + cl.w / 2 - b.x) / b.w) * 330;
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `hsla(${hue},90%,60%,${0.14 * glow})`;
        ctx.fillRect(T.x + 3, T.y + 3 + key.depth * travel, T.w - 6, T.h - 6 - u * 0.17);
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  },
};

/* ───────────── 낙엽 씬 ───────────── */
// 낙엽 종류별 색: 단풍은 붉게, 은행은 노랗게, 참나무는 갈색으로
const LEAF_TYPES = {
  oval:   ['#c8501e', '#d9822b', '#e2a93b', '#a63a1c', '#8a5a2b', '#b8862f'],
  maple:  ['#c8501e', '#a63a1c', '#cf6a2a', '#b53a24'],
  ginkgo: ['#e2c23b', '#d9b02b', '#e8cf55'],
  oak:    ['#8a5a2b', '#9c4a1a', '#b8862f', '#7a4a22'],
  elm:    ['#d9822b', '#b8862f', '#e2a93b', '#c8701e'],
};

function hexToHsl(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return [h, s * 100, l * 100];
}

const Leaves = {
  hint: '낙엽을 클릭하거나 드래그해서 바스락 부숴 보세요',
  resetLabel: '다시 뿌리기',
  pieces: [],   // 부술 수 있는 낙엽/조각
  dust: [],     // 튀는 가루
  crushed: 0,

  rand(a, b) { return a + Math.random() * (b - a); },
  randInt(n) { return Math.floor(Math.random() * n); },

  // 낙엽 윤곽선(로컬 좌표, 잎끝이 위쪽 -y). 종류마다 모양이 다르다.
  outline(type, r) {
    const pts = [];
    if (type === 'maple') {          // 단풍잎: 뾰족한 5갈래
      const S = 1.25, off = 0.35 * r;
      const spec = [[0, 1], [17, 0.52], [48, 0.95], [70, 0.5], [98, 0.74], [128, 0.4], [160, 0.34], [180, 0.3]];
      const half = spec.map(([d, k]) => { const a = d * Math.PI / 180; return [Math.sin(a) * k * r * S, -Math.cos(a) * k * r * S + off]; });
      for (const q of half) pts.push(q);
      for (let i = half.length - 2; i >= 1; i--) pts.push([-half[i][0], half[i][1]]);
    } else if (type === 'ginkgo') {  // 은행잎: 가운데가 살짝 갈라진 부채꼴
      const B = [0, r * 0.7], R = r * 1.4, phi = 48 * Math.PI / 180, n = 32;
      pts.push(B);
      for (let i = 0; i <= n; i++) {
        const a = -phi + 2 * phi * i / n, d = Math.abs(a);
        const rad = d < 0.13 ? R * (0.72 + 0.28 * d / 0.13) : R;
        pts.push([B[0] + Math.sin(a) * rad, B[1] - Math.cos(a) * rad]);
      }
    } else {                         // 타원형 · 참나무(물결 모양 가장자리) · 느릅나무(톱니 모양 가장자리)
      const n = 72, right = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n, base = Math.sin(Math.PI * Math.pow(t, 0.8));
        let w = 0.66 * base;
        if (type === 'oak') w *= 1 + 0.36 * Math.sin(t * Math.PI * 8 - 0.4) * Math.min(1, t * 5, (1 - t) * 5);
        else if (type === 'elm') w = 0.6 * base * (1 + 0.14 * (1 - ((t * 26) % 1)));
        else w = 0.66 * Math.sin(Math.PI * Math.pow(t, 0.85));
        right.push([w * r, -r + t * 1.9 * r]);
      }
      for (const q of right) pts.push(q);
      for (let i = right.length - 2; i >= 1; i--) pts.push([-right[i][0], right[i][1]]);
    }
    return pts;
  },

  inPoly(poly, x, y) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  },

  // 텍스처용 캔버스 (화면 배율에 맞춰 선명하게)
  mkCanvas(wCss, hCss) {
    const s = Math.min(2, window.devicePixelRatio || 1);
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(wCss * s); cv.height = Math.ceil(hCss * s);
    const c = cv.getContext('2d');
    c.scale(s, s);
    return { cv, c };
  },

  drawPath(c, poly) {
    c.beginPath();
    poly.forEach(([x, y], i) => { if (i) c.lineTo(x, y); else c.moveTo(x, y); });
    c.closePath();
  },

  // 잎맥: 어두운 선 + 살짝 밝은 선을 겹쳐 볼록한 느낌을 낸다
  drawVeins(c, type, r) {
    const build = () => {
      c.beginPath();
      if (type === 'maple') {
        const S = 1.25, off = 0.35 * r;
        for (const [d, k] of [[0, 1], [48, 0.95], [-48, 0.95], [98, 0.74], [-98, 0.74]]) {
          const a = d * Math.PI / 180, ex = Math.sin(a) * k * r * S * 0.9, ey = -Math.cos(a) * k * r * S * 0.9 + off;
          c.moveTo(0, 0.55 * r); c.lineTo(ex, ey);
          // 갈래마다 잔가지
          for (const f of [0.45, 0.7]) {
            const bx = ex * f, by = 0.55 * r + (ey - 0.55 * r) * f;
            c.moveTo(bx, by); c.lineTo(bx + ey * 0.0 + (Math.cos(a) * 0.16 * r), by + Math.sin(a) * 0.16 * r - 0.1 * r);
            c.moveTo(bx, by); c.lineTo(bx - (Math.cos(a) * 0.16 * r), by - Math.sin(a) * 0.16 * r - 0.1 * r);
          }
        }
        c.moveTo(0, 0.55 * r); c.lineTo(0, 1.12 * r);
      } else if (type === 'ginkgo') {
        const B = [0, r * 0.7];
        for (let d = -42; d <= 42; d += 10.5) {
          const a = d * Math.PI / 180;
          c.moveTo(B[0], B[1]); c.lineTo(Math.sin(a) * r * 1.3, B[1] - Math.cos(a) * r * 1.3);
        }
        c.moveTo(B[0], B[1]); c.lineTo(0, B[1] + 0.4 * r);
      } else {
        const pairs = type === 'elm' ? 7 : 5;
        c.moveTo(0, r * 1.18); c.lineTo(0, -r * 0.88);
        for (let i = 1; i <= pairs; i++) {
          const y = r * 0.62 - (i * 1.25 * r) / pairs;
          const w = r * 0.52 * Math.sin(Math.PI * Math.min(1, (y + r) / (1.9 * r)));
          for (const sg of [1, -1]) {
            c.moveTo(0, y + r * 0.1); c.lineTo(sg * w, y - r * 0.22);
            for (const f of [0.4, 0.7]) { // 곁가지
              const bx = sg * w * f, by = y + r * 0.1 + (-r * 0.32) * f;
              c.moveTo(bx, by); c.lineTo(bx + sg * w * 0.28, by - r * 0.1);
            }
          }
        }
      }
    };
    c.lineCap = 'round';
    c.save(); c.translate(0.9, 0.9); build();
    c.strokeStyle = 'rgba(255,240,200,0.22)'; c.lineWidth = Math.max(1, r / 50); c.stroke(); c.restore();
    build();
    c.strokeStyle = 'rgba(50,22,5,0.42)'; c.lineWidth = Math.max(1, r / 58); c.stroke();
  },

  // 낙엽 한 장의 그림을 미리 그려 둔다: 색 변화, 얼룩, 잔점, 볼록한 잎맥, 마른 테두리, 줄기
  renderLeafTex(type, r, color, outline) {
    const E = Math.ceil(r * 1.35);
    const { cv, c } = this.mkCanvas(2 * E, 2 * E);
    c.translate(E, E);
    const [h, sat, l] = hexToHsl(color);
    c.save();
    this.drawPath(c, outline); c.clip();
    const g = c.createLinearGradient(-r, -r, r, r);
    g.addColorStop(0, `hsl(${h - 10} ${sat}% ${Math.min(80, l + 10)}%)`);
    g.addColorStop(0.5, `hsl(${h} ${sat}% ${l}%)`);
    g.addColorStop(1, `hsl(${h + 9} ${sat * 0.92}% ${Math.max(15, l - 9)}%)`);
    c.fillStyle = g; c.fillRect(-E, -E, 2 * E, 2 * E);
    const rg = c.createRadialGradient(0, 0.1 * r, r * 0.3, 0, 0.1 * r, r * 1.15);
    rg.addColorStop(0, 'rgba(255,240,200,0.10)'); rg.addColorStop(1, 'rgba(40,15,0,0.38)');
    c.fillStyle = rg; c.fillRect(-E, -E, 2 * E, 2 * E);
    // 마르고 그을린 얼룩
    for (let i = 0; i < 10; i++) {
      const x = this.rand(-r * 0.8, r * 0.8), y = this.rand(-r * 0.8, r * 0.9), rad = this.rand(0.08, 0.22) * r;
      const bg = c.createRadialGradient(x, y, 0, x, y, rad);
      const dark = i < 7;
      bg.addColorStop(0, dark ? 'rgba(60,25,5,0.18)' : 'rgba(255,225,160,0.12)'); bg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = bg; c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); c.fill();
    }
    this.drawVeins(c, type, r);
    // 잔점 (질감)
    const n = Math.round((r * r) / 12);
    for (let i = 0; i < n; i++) {
      c.fillStyle = Math.random() < 0.6 ? `rgba(45,20,5,${this.rand(0.05, 0.2)})` : `rgba(255,235,190,${this.rand(0.04, 0.14)})`;
      c.beginPath(); c.arc(this.rand(-E, E), this.rand(-E, E), this.rand(0.4, 1.5), 0, Math.PI * 2); c.fill();
    }
    // 잎이 살짝 휜 듯한 명암: 한쪽은 빛을 받아 밝고 반대쪽은 그늘진다
    const ca = this.rand(0, Math.PI * 2), cxr = Math.cos(ca) * r, cyr = Math.sin(ca) * r;
    const curl = c.createLinearGradient(-cxr, -cyr, cxr, cyr);
    curl.addColorStop(0, 'rgba(255,238,200,0.22)'); curl.addColorStop(0.5, 'rgba(255,238,200,0)'); curl.addColorStop(1, 'rgba(20,8,0,0.28)');
    c.fillStyle = curl; c.fillRect(-E, -E, 2 * E, 2 * E);
    // 마르면서 생긴 잔주름: 어두운 선 옆에 밝은 선
    c.lineCap = 'round';
    for (let i = 0; i < 9; i++) {
      const a0 = this.rand(0, Math.PI * 2), r0 = this.rand(0, r * 0.7), len = r * this.rand(0.15, 0.4), a1 = a0 + this.rand(-1, 1);
      const x0 = Math.cos(a0) * r0, y0 = Math.sin(a0) * r0 * 1.2, x1 = x0 + Math.cos(a1) * len, y1 = y0 + Math.sin(a1) * len;
      const mx = (x0 + x1) / 2 + this.rand(-1, 1) * len * 0.3, my = (y0 + y1) / 2 + this.rand(-1, 1) * len * 0.3;
      c.lineWidth = Math.max(1, r / 70); c.strokeStyle = 'rgba(40,15,0,0.18)';
      c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(mx, my, x1, y1); c.stroke();
      c.strokeStyle = 'rgba(255,235,190,0.16)';
      c.beginPath(); c.moveTo(x0 + 1, y0 + 1); c.quadraticCurveTo(mx + 1, my + 1, x1 + 1, y1 + 1); c.stroke();
    }
    // 마른 가장자리
    this.drawPath(c, outline);
    c.lineWidth = r * 0.09; c.strokeStyle = 'rgba(50,20,0,0.28)'; c.stroke();
    // 말려 올라간 가장자리에 걸리는 빛 (빛이 오는 쪽 가장자리만 밝다)
    const eg = c.createLinearGradient(-cxr, -cyr, cxr, cyr);
    eg.addColorStop(0, 'rgba(255,232,180,0.5)'); eg.addColorStop(0.45, 'rgba(255,232,180,0)');
    c.lineWidth = Math.max(1.5, r / 45); c.strokeStyle = eg; c.stroke();
    c.restore();
    // 벌레 먹은 구멍 (구멍 너머로 바닥이 보인다)
    const holes = this.randInt(3);
    for (let i = 0; i < holes; i++) {
      let hx = 0, hy = 0, ok = false;
      for (let t = 0; t < 30 && !ok; t++) { hx = this.rand(-r * 0.6, r * 0.6); hy = this.rand(-r * 0.7, r * 0.8); ok = this.inPoly(outline, hx, hy) && this.inPoly(outline, hx + r * 0.1, hy) && this.inPoly(outline, hx - r * 0.1, hy); }
      if (!ok) continue;
      const hr = r * this.rand(0.025, 0.06), rot = this.rand(0, Math.PI);
      c.save(); c.translate(hx, hy); c.rotate(rot);
      c.globalCompositeOperation = 'destination-out';
      c.beginPath(); c.ellipse(0, 0, hr * 1.3, hr, 0, 0, Math.PI * 2); c.fill();
      c.globalCompositeOperation = 'source-over';
      c.strokeStyle = 'rgba(40,18,4,0.65)'; c.lineWidth = 1.3;
      c.beginPath(); c.ellipse(0, 0, hr * 1.3 + 0.6, hr + 0.6, 0, 0, Math.PI * 2); c.stroke();
      c.restore();
    }
    // 윤곽선과 줄기
    c.lineJoin = 'round'; c.lineCap = 'round';
    const stem = type === 'maple' ? [0.72, 1.15] : type === 'ginkgo' ? [0.7, 1.12] : [0.9, 1.2];
    c.strokeStyle = `hsl(${h} ${sat * 0.6}% ${Math.max(12, l - 22)}%)`; c.lineWidth = Math.max(1.5, r / 26);
    c.beginPath(); c.moveTo(0, stem[0] * r); c.lineTo(0, stem[1] * r); c.stroke();
    this.drawPath(c, outline);
    c.lineWidth = Math.max(1.2, r / 60); c.strokeStyle = 'rgba(30,12,0,0.55)'; c.stroke();
    return { cv, ox: E, oy: E, w: 2 * E, h: 2 * E };
  },

  makeLeaf(x, y, r, type, color, rot) {
    const outline = this.outline(type, r);
    return {
      x, y, r, level: 0, rot, type, color, vx: 0, vy: 0, vr: 0, age: 1, dead: false,
      tex: this.renderLeafTex(type, r, color, outline),
      inside: (px, py) => this.inPoly(outline, px, py),
    };
  },

  // 울퉁불퉁하게 찢어진 조각의 윤곽
  jagged(R) {
    const n = 8 + this.randInt(4), base = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + this.rand(-0.2, 0.2), rad = R * this.rand(0.72, 1.08);
      base.push([Math.cos(a) * rad, Math.sin(a) * rad]);
    }
    const out = [];
    for (let i = 0; i < n; i++) { // 변마다 중간 점을 흔들어 찢어진 느낌을 낸다
      const [x1, y1] = base[i], [x2, y2] = base[(i + 1) % n];
      out.push([x1, y1]);
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, len = Math.hypot(x2 - x1, y2 - y1);
      const nx = -(y2 - y1) / (len || 1), ny = (x2 - x1) / (len || 1), j = this.rand(-0.16, 0.16) * len;
      out.push([mx + nx * j, my + ny * j]);
    }
    return out;
  },

  // 부모 그림에서 (cx, cy) 주변을 찢어 낸 조각. 잎맥, 얼룩, 색이 그대로 따라온다.
  cutPiece(parent, cx, cy, Rc, level) {
    const Rk = Math.ceil(Rc * 1.3);
    const poly = this.jagged(Rc);
    const { cv, c } = this.mkCanvas(2 * Rk, 2 * Rk);
    c.translate(Rk, Rk);
    c.save();
    this.drawPath(c, poly); c.clip();
    const T = parent.tex;
    c.drawImage(T.cv, -T.ox - cx, -T.oy - cy, T.w, T.h);
    // 종이처럼 살짝 휜 느낌의 명암
    const a = this.rand(0, Math.PI * 2), gx = Math.cos(a) * Rc, gy = Math.sin(a) * Rc;
    const g = c.createLinearGradient(-gx, -gy, gx, gy);
    g.addColorStop(0, 'rgba(255,255,255,0.07)'); g.addColorStop(1, 'rgba(0,0,0,0.2)');
    c.globalCompositeOperation = 'source-atop';
    c.fillStyle = g; c.fillRect(-Rk, -Rk, 2 * Rk, 2 * Rk);
    c.restore();
    // 찢어진 가장자리: 밝게 마른 테두리 (이미 그려진 부분 위에만 칠한다)
    c.globalCompositeOperation = 'source-atop';
    c.lineJoin = 'round';
    this.drawPath(c, poly);
    c.strokeStyle = 'rgba(214,184,128,0.42)'; c.lineWidth = 4.2; c.stroke();  // 찢어진 자리에 드러난 마른 잎 속살의 연한 색
    c.strokeStyle = 'rgba(96,60,24,0.5)'; c.lineWidth = 2.6; c.stroke();
    c.strokeStyle = 'rgba(30,12,2,0.55)'; c.lineWidth = 1.2; c.stroke();     // 얇고 어두운 윤곽
    const cs = Math.cos(parent.rot), sn = Math.sin(parent.rot);
    return {
      x: parent.x + cx * cs - cy * sn, y: parent.y + cx * sn + cy * cs,
      r: Rc * 0.9, level, rot: parent.rot, color: parent.color, type: null,
      vx: 0, vy: 0, vr: this.rand(-2.5, 2.5), age: 0, dead: false,
      tex: { cv, ox: Rk, oy: Rk, w: 2 * Rk, h: 2 * Rk },
      inside: (px, py) => this.inPoly(poly, px, py) && parent.inside(px + cx, py + cy),
    };
  },

  pickCenters(p, n, Rc) {
    const out = [], ext = p.tex.w / 2;
    for (let t = 0; t < 90 && out.length < n; t++) {
      const x = this.rand(-ext, ext), y = this.rand(-ext, ext);
      if (!p.inside(x, y)) continue;
      const minD = t < 45 ? Rc * 1.0 : Rc * 0.55;
      if (out.every(q => Math.hypot(q[0] - x, q[1] - y) >= minD)) out.push([x, y]);
    }
    if (!out.length) out.push([0, 0]);
    return out;
  },

  // 숲 바닥을 한 번만 그려 둔다
  buildGround(w, h) {
    const { cv, c } = mkTex(w, h), R = () => Math.random();
    let g = c.createRadialGradient(w / 2, h * 0.45, 0, w / 2, h * 0.45, Math.max(w, h) * 0.8);
    g.addColorStop(0, '#43331f'); g.addColorStop(1, '#1a130c');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 70; i++) { // 흙덩이: 크고 흐린 명암
      const x = R() * w, y = R() * h, rad = 10 + R() * 40, dark = R() < 0.55;
      const bg = c.createRadialGradient(x, y, 0, x, y, rad);
      bg.addColorStop(0, dark ? 'rgba(20,12,5,0.22)' : 'rgba(120,90,55,0.14)'); bg.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = bg; c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); c.fill();
    }
    for (let i = 0; i < (w * h) / 22; i++) { // 고운 흙 알갱이
      c.fillStyle = R() < 0.55 ? `rgba(15,8,2,${0.06 + R() * 0.1})` : `rgba(150,115,75,${0.04 + R() * 0.08})`;
      c.fillRect(R() * w, R() * h, 1 + R(), 1 + R());
    }
    for (let i = 0; i < 26; i++) { // 자갈
      const x = R() * w, y = R() * h, rx = 3 + R() * 7, ry = rx * (0.6 + R() * 0.3), rot = R() * 3;
      c.save(); c.translate(x, y); c.rotate(rot);
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.beginPath(); c.ellipse(1.5, 2, rx, ry, 0, 0, Math.PI * 2); c.fill();
      const pg = c.createLinearGradient(-rx, -ry, rx, ry); pg.addColorStop(0, '#8a7a66'); pg.addColorStop(1, '#4a3f33');
      c.fillStyle = pg; c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); c.fill();
      c.restore();
    }
    for (let i = 0; i < 9; i++) { // 잔가지: 그림자 + 갈색 몸통 + 밝은 결
      const x0 = R() * w, y0 = R() * h, ang = R() * Math.PI, len = 40 + R() * 110, bend = (R() - 0.5) * 30;
      const x1 = x0 + Math.cos(ang) * len, y1 = y0 + Math.sin(ang) * len, mx = (x0 + x1) / 2 + bend, my = (y0 + y1) / 2 - bend;
      c.lineCap = 'round';
      for (const [dx, dy, col, lw] of [[2, 3, 'rgba(0,0,0,0.4)', 4], [0, 0, '#5b4029', 3], [-0.6, -0.8, 'rgba(210,170,120,0.35)', 1]]) {
        c.strokeStyle = col; c.lineWidth = lw;
        c.beginPath(); c.moveTo(x0 + dx, y0 + dy); c.quadraticCurveTo(mx + dx, my + dy, x1 + dx, y1 + dy); c.stroke();
      }
    }
    for (let i = 0; i < 90; i++) { // 풀잎
      const x = R() * w, y = R() * h, len = 10 + R() * 22, a = -Math.PI / 2 + (R() - 0.5) * 1.2;
      c.strokeStyle = `rgba(${70 + R() * 40},${85 + R() * 40},${35 + R() * 20},${0.35 + R() * 0.3})`; c.lineWidth = 1 + R();
      c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + Math.cos(a) * len * 0.5 + (R() - 0.5) * 8, y + Math.sin(a) * len * 0.5, x + Math.cos(a) * len, y + Math.sin(a) * len); c.stroke();
    }
    for (let i = 0; i < 45; i++) { // 마른 낙엽 부스러기 (바닥에 깔린 낡은 잎)
      const x = R() * w, y = R() * h, sz = 5 + R() * 14, rot = R() * 6.28, n = 5 + Math.floor(R() * 3);
      c.save(); c.translate(x, y); c.rotate(rot);
      c.fillStyle = ['rgba(122,74,34,0.55)', 'rgba(150,96,44,0.5)', 'rgba(96,60,28,0.6)', 'rgba(170,125,60,0.45)'][Math.floor(R() * 4)];
      c.beginPath(); for (let k = 0; k < n; k++) { const a = (k / n) * 6.28, rr = sz * (0.6 + R() * 0.5); (k ? c.lineTo : c.moveTo).call(c, Math.cos(a) * rr, Math.sin(a) * rr * 0.6); } c.closePath(); c.fill();
      c.restore();
    }
    for (let i = 0; i < 8; i++) { // 나뭇잎 사이로 드는 빛 무늬
      const x = R() * w, y = R() * h, rad = 50 + R() * 110, lg = c.createRadialGradient(x, y, 0, x, y, rad);
      lg.addColorStop(0, 'rgba(255,225,160,0.10)'); lg.addColorStop(1, 'rgba(255,225,160,0)');
      c.fillStyle = lg; c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); c.fill();
    }
    g = c.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.8);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    return cv;
  },

  init(w, h) {
    this.groundTex = this.buildGround(w, h);
    this.pieces = [];
    this.dust = [];
    this.crushed = 0;
    const count = 3 + this.randInt(2); // 3~4장
    const top = 70; // 상단 메뉴 아래부터
    const types = Object.keys(LEAF_TYPES);
    for (let i = 0; i < count; i++) {
      // 화면 크기에 비례하는 큰 낙엽. 서로 너무 겹치지 않게 몇 번 다시 뽑는다.
      const r = Math.max(60, Math.min(180, Math.min(w, h - top) * this.rand(0.24, 0.32)));
      let x, y;
      for (let tries = 0; tries < 60; tries++) {
        x = this.rand(r * 1.15, w - r * 1.15);   // 회전해도 잎끝(r)과 줄기(1.15r)가 화면 안에 들어오게
        y = this.rand(top + r * 1.15, h - r * 1.15);
        if (this.pieces.every(q => Math.hypot(q.x - x, q.y - y) > (q.r + r) * 0.85)) break;
      }
      const type = types[this.randInt(types.length)], colors = LEAF_TYPES[type];
      this.pieces.push(this.makeLeaf(x, y, r, type, colors[this.randInt(colors.length)], this.rand(0, Math.PI * 2)));
    }
    this.updateUI();
  },

  updateUI() {
    UI.setText(`${this.crushed}번 바스락`);
    UI.resetBtn.classList.toggle('pulse', this.pieces.length === 0);
  },

  onDown(x, y, speed) { this.hit(x, y, speed); },
  onMove(x, y, speed) { this.hit(x, y, speed); },
  onUp() {},

  hit(x, y, speed) {
    // 위에 놓인(나중에 그려진) 것부터 검사한다
    for (let i = this.pieces.length - 1; i >= 0; i--) {
      const p = this.pieces[i];
      if (p.dead || p.age < 0.18) continue; // 방금 갈라진 조각은 잠깐 봐준다
      const dx = x - p.x, dy = y - p.y, rr = p.r * (p.level === 0 ? 0.8 : 0.95);
      if (dx * dx + dy * dy <= rr * rr) this.crush(p, speed);
    }
    this.pieces = this.pieces.filter(p => !p.dead);
  },

  crush(p, speed) {
    p.dead = true;
    this.crushed++;
    const vol = Math.min(1, 0.55 + speed * 0.0003) * this.rand(0.85, 1);
    const pan = Math.max(-0.8, Math.min(0.8, (p.x / W) * 2 - 1));
    Sound.leaf(p.level, vol, pan);
    if (navigator.vibrate) navigator.vibrate(p.level === 0 ? 8 : 4);
    if (p.level < 2) { // 부서지면 원래 그림을 이어받은 조각들과 잔조각으로 갈라진다
      const big = p.level === 0;
      const Rc = p.r * (big ? 0.55 : 0.6);
      const make = (centers, R, level) => {
        for (const [cx, cy] of centers) {
          const c = this.cutPiece(p, cx, cy, R, level);
          const dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1, sp = this.rand(1.2, 2.4) * p.r;
          c.vx = (dx / d) * sp + this.rand(-25, 25); c.vy = (dy / d) * sp + this.rand(-25, 25);
          this.pieces.push(c);
        }
      };
      make(this.pickCenters(p, big ? 3 + this.randInt(2) : 2 + this.randInt(2), Rc), Rc, p.level + 1);
      make(this.pickCenters(p, big ? 4 : 3, Rc * 0.5), Rc * 0.5, 2); // 잔조각
    }
    const dn = p.level === 2 ? 8 : 16, k = Math.min(3, Math.max(1, p.r / 45));
    for (let i = 0; i < dn; i++) {
      const a = this.rand(0, Math.PI * 2), sp = this.rand(40, 160) * Math.max(1, p.r / 60);
      this.dust.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: this.rand(1.5, 3.4) * k,
        rot: this.rand(0, Math.PI * 2), life: 1, color: Math.random() < 0.25 ? '#e9cf9c' : p.color });
    }
    if (this.dust.length > 500) this.dust.splice(0, this.dust.length - 500);
    this.updateUI();
  },

  update(dt) {
    for (const p of this.pieces) {
      p.age += dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const k = Math.pow(0.04, dt); // 마찰
      p.vx *= k; p.vy *= k; p.vr *= k;
    }
    for (const d of this.dust) {
      d.x += d.vx * dt; d.y += d.vy * dt; d.rot += dt * 3;
      d.vx *= Math.pow(0.02, dt); d.vy *= Math.pow(0.02, dt);
      d.life -= dt * 0.35; // 바닥에 남았다가 천천히 사라진다
    }
    this.dust = this.dust.filter(d => d.life > 0);
  },

  draw(ctx, w, h) {
    // 땅
    ctx.drawImage(this.groundTex, 0, 0, w, h);
    // 가루: 작은 삼각형 부스러기
    for (const d of this.dust) {
      ctx.globalAlpha = Math.min(1, d.life * 1.5) * 0.9;
      ctx.fillStyle = d.color;
      ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot);
      ctx.beginPath(); ctx.moveTo(-d.s * 0.6, d.s * 0.4); ctx.lineTo(d.s * 0.7, 0); ctx.lineTo(-d.s * 0.2, -d.s * 0.7); ctx.closePath();
      ctx.fill(); ctx.restore();
    }
    ctx.globalAlpha = 1;
    // 낙엽과 조각: 바닥에 그림자가 살짝 진다
    const dpr = window.devicePixelRatio || 1;
    for (const p of this.pieces) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (p.level === 0) { // 넓게 퍼지는 부드러운 그림자 (잎이 살짝 떠 있는 느낌)
        ctx.shadowColor = 'rgba(0,0,0,0.32)'; ctx.shadowBlur = 16 * dpr; ctx.shadowOffsetY = 9 * dpr;
        ctx.drawImage(p.tex.cv, -p.tex.ox, -p.tex.oy, p.tex.w, p.tex.h);
      }
      ctx.shadowColor = 'rgba(0,0,0,0.5)';                                   // 바닥에 닿은 진한 접촉 그림자
      ctx.shadowBlur = (p.level === 0 ? 3 : 4) * dpr;
      ctx.shadowOffsetY = (p.level === 0 ? 1.5 : 2) * dpr;
      ctx.drawImage(p.tex.cv, -p.tex.ox, -p.tex.oy, p.tex.w, p.tex.h);
      ctx.restore();
    }
  },
};

/* ───────────── 크런치 말랑이 씬 ───────────── */
const SQUISH_COLORS = [
  { name: '분홍',   light: '#ffe0ec', base: '#ff8fb8', dark: '#d94a86', bead: '200,60,110' },
  { name: '민트',   light: '#dcfff2', base: '#7fe3c0', dark: '#2fae8a', bead: '30,120,90' },
  { name: '노랑',   light: '#fff6c9', base: '#ffd96a', dark: '#d9a520', bead: '150,100,10' },
  { name: '보라',   light: '#efe3ff', base: '#b99cff', dark: '#7a54d6', bead: '90,50,170' },
  { name: '하늘',   light: '#dff2ff', base: '#84c8ff', dark: '#3b86d4', bead: '30,80,150' },
];

// '#rrggbb' 색에 투명도를 붙여 rgba() 문자열로 만든다
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

const Squishy = {
  hint: '꾹 누르거나 문질러서 마음대로 찌그러뜨려 보세요',
  resetLabel: '초기화',
  N: 72,               // 윤곽 점 개수
  r: null, v: null,    // 각 점의 반지름과 속도 (스프링)
  rest: null,          // 각 점의 "기억된" 반지름: 눌러서 찌그러진 모양이 여기에 남는다
  bent: false,
